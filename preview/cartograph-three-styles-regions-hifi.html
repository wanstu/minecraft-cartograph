function finishRegionDrawing(){if(!regionDrawing)return;if(regionDrawing.length<3){toast('至少选择三个边界点');return}if(Math.abs(polygonArea(regionDrawing))<250){toast('区域面积过小，请扩大圈选范围');return}const points=regionDrawing.map(p=>p.slice()),editId=regionRedrawingId;cancelRegionDrawing();openRegionEditor(editId,points);regionRedrawingId=null}
function openRegionEditor(id,points){panelClose();const region=id?regions.find(r=>r.id===id):null;regionEditId=region?.id||null;const pts=points||region?.points;if(!pts)return;modal='region';const name=region?.name||'',type=region?.type||'other',color=region?.color||regionTypes.other.color;
  modalEl.innerHTML=`<div class="modalHeading"><div><div class="panelLabel">CARTOGRAPH / NAMED REGION</div><h2>${region?'编辑区域名称':'为这片区域命名'}</h2><p>选中 ${pts.length} 个边界点 · 这不是普通坐标标点</p></div><button data-act="modal-close">×</button></div><div class="settingCaption">区域名称</div><input class="settingInput" id="regionName" maxlength="24" placeholder="例如：北境海、苍岚山脉、雾松林" value="${escapeHtml(name)}"/><div class="regionFormGrid"><label style="margin-top:17px">地理区域类型<select id="regionType" class="settingInput">${Object.entries(regionTypes).map(([key,v])=>`<option value="${key}" ${key===type?'selected':''}>${v.name}</option>`).join('')}</select></label><label style="margin-top:17px">注记颜色<input class="settingInput regionColorInput" type="color" id="regionColor" value="${escapeHtml(color)}"/></label></div>${region?`<div style="margin-top:15px"><button class="btn" data-region-action="redraw" data-region-id="${escapeHtml(region.id)}">✎ 重新圈选区域边界</button></div>`:''}<div class="regionFormHint">区域边界不会改变地形数据。像素地图使用清晰地名，写实地图使用现代注记，手绘地图使用古式书写风格；三个画法共享同一处区域。</div><div class="modalFooter"><small>保存在本地演示数据；将来模组中会按世界与维度保存。</small><div style="display:flex;gap:9px"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-region-action="save">保存区域名称</button></div></div>`;
  modalEl.dataset.regionPoints=JSON.stringify(pts);backdrop.classList.remove('hidden');setTimeout(()=>$('#regionName')?.focus(),0);
}
function saveRegionEditor(){const name=$('#regionName')?.value?.trim(),type=$('#regionType')?.value||'other',color=$('#regionColor')?.value||regionTypes.other.color;if(!name){toast('请输入区域名称');$('#regionName')?.focus();return}if(!regionTypes[type]){toast('无效区域类型');return}let pts;try{pts=JSON.parse(modalEl.dataset.regionPoints)}catch{return}if(!Array.isArray(pts)||pts.length<3)return;
 const existing=regionEditId?regions.find(r=>r.id===regionEditId):null;
 if(existing){existing.name=name;existing.type=type;existing.color=color;existing.points=pts;delete existing.label;selectedRegionId=existing.id}
 else{if(regions.length>=80){toast('原型最多支持 80 个区域');return}const region={id:'region-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,type,color,points:pts};regions.push(region);selectedRegionId=region.id}
 saveRegions();modalClose();panel='regions';panelEl.classList.remove('hidden');repaintRegionPanel();toast(`区域「${name}」已保存 · 三种地图风格共用`);
}
function handleRegionButton(e){const b=e.target.closest('[data-region-action]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const act=b.dataset.regionAction,id=b.dataset.regionId;
 if(act==='draw')startRegionDrawing();
 else if(act==='redraw'){const item=regions.find(x=>x.id===id);if(item){startRegionDrawing(item.id);toast('重新绘制「'+item.name+'」的区域边界')}}
 else if(act==='finish')finishRegionDrawing();
 else if(act==='undo'){if(regionDrawing?.length){regionDrawing.pop();updateRegionGuide();requestRender()}}
 else if(act==='cancel')cancelRegionDrawing();
 else if(act==='save')saveRegionEditor();
 else if(['focus','edit','delete'].includes(act)){const r=regions.find(x=>x.id===id);if(!r)return;
  if(act==='focus'){[cx,cy]=regionCenter(r);selectedRegionId=r.id;panelClose();requestRender();toast('已定位至「'+r.name+'」')}
  else if(act==='edit')openRegionEditor(id);
  else if(act==='delete'){if(confirm('删除区域「'+r.name+'」？这不会删除任何地图地形或标点。')){regions=regions.filter(x=>x.id!==id);if(selectedRegionId===id)selectedRegionId='';saveRegions();repaintRegionPanel();toast('已删除区域名称')}}
 }
}
function initRegionEvents(){
 // Capture click events for the independent region buttons before legacy menu router.
 document.addEventListener('click',handleRegionButton,true);
 area.addEventListener('pointerdown',e=>{if(!regionDrawing||e.button!==0)return; e.preventDefault();e.stopImmediatePropagation();
  const [x,y]=worldPos(e.clientX,e.clientY);
  if(e.detail>=2&&regionDrawing.length>=3){finishRegionDrawing();return}
  if(regionDrawing.length>=3&&Math.hypot(x-regionDrawing[0][0],y-regionDrawing[0][1])*scale<14){finishRegionDrawing();return}
  addRegionVertex(x,y);
 },true);
 area.addEventListener('pointermove',e=>{if(!regionDrawing)return;regionPreview=worldPos(e.clientX,e.clientY);requestRender()},true);
 area.addEventListener('contextmenu',e=>{if(regionDrawing){e.preventDefault();e.stopImmediatePropagation();finishRegionDrawing();return}
  const [x,y]=worldPos(e.clientX,e.clientY),r=regionAt(x,y);
  if(r){e.preventDefault();e.stopImmediatePropagation();const menu=$('#contextMenu');menu.style.left=clamp(e.clientX,8,w-195)+'px';menu.style.top=clamp(e.clientY,8,h-125)+'px';menu.innerHTML=`<button data-region-action="edit" data-region-id="${escapeHtml(r.id)}">✎ 编辑「${escapeHtml(r.name)}」</button><button data-region-action="focus" data-region-id="${escapeHtml(r.id)}">⌖ 定位区域中心</button><button data-region-action="draw">＋ 重新圈选其他区域</button>`;menu.classList.remove('hidden')}
 },true);
 window.addEventListener('keydown',e=>{if(regionDrawing){if(e.key==='Escape'){e.preventDefault();cancelRegionDrawing()}
   else if(e.key==='Enter'){e.preventDefault();finishRegionDrawing()}
   else if(e.key==='Backspace'){e.preventDefault();regionDrawing.pop();updateRegionGuide();requestRender()}}},true);
}

function start(){initRegionEvents();collectGeometry();realBase=makeRaster('realistic');inkBase=makeRaster('illustrated');pixelBase=makePixelRaster();scale=Math.max(innerWidth/W,innerHeight/H)*1.08;cx=630;cy=465;rebuild();initEvents();syncSize();setMode('compare');}
start();
})();
</script>
