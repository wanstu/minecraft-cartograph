#scene{position:relative;width:100vw;height:100vh;overflow:hidden;background:#86b7cb}

.slot{width:45px;height:45px;background:#373b37bb;border:2px solid #171b17bb;display:flex;justify-content:center;align-items:center;color:#e1e2d0;font-size:21px;text-shadow:1px 2px 2px #000}.slot.selected{outline:3px solid #fff;outline-offset:1px}
#health{position:absolute;bottom:77px;left:50%;transform:translateX(-50%);width:440px;display:flex;justify-content:space-between;font-size:20px;text-shadow:1px 2px 2px #000}
.hp{color:#e44a43;letter-spacing:2px}.food{color:#f9bd75;letter-spacing:2px}
#miniHud{position:absolute;z-index:4;box-sizing:content-box;pointer-events:none;filter:drop-shadow(0 6px 10px #0007)}

#miniHud.rotated #miniMap{transform-origin:center}
#playerArrow{position:absolute;left:50%;top:50%;font-size:25px;color:#ffffe5;transform:translate(-50%,-52%) rotate(24deg);text-shadow:0 1px 4px #000,1px 1px #2a4434;z-index:3}

.cardinal{position:absolute;z-index:5;color:#fffcdf;text-shadow:0 1px 3px #000,1px 2px 4px #000;font-size:15px;font-family:Consolas,monospace;font-weight:900}
.n{left:50%;top:5px;transform:translateX(-50%)}.s{left:50%;bottom:5px;transform:translateX(-50%)}.w{left:7px;top:50%;transform:translateY(-50%)}.e{right:7px;top:50%;transform:translateY(-50%)}

#miniFrame{isolation:isolate}
#miniMap{transform-origin:center;transition:transform .1s}

#miniHud.editing{pointer-events:auto;cursor:move;outline:2px dashed #ffe5a8;outline-offset:4px}
#miniHud.editing #miniFrame{pointer-events:none}
#miniResizeHandle{display:none;position:absolute;bottom:-17px;right:-17px;width:30px;height:30px;border:2px solid #fff2cd;color:#28422f;border-radius:8px;background:#e9c98c;align-items:center;justify-content:center;font-size:21px;font-weight:900;cursor:nwse-resize;z-index:10}
#miniHud.editing #miniResizeHandle{display:flex;pointer-events:auto}
.miniMapIcon,.miniRegionName{position:absolute;pointer-events:none;z-index:2;transform:translate(-50%,-50%);text-shadow:0 1px 3px #4236269c}
.miniMapIcon{display:grid;place-items:center;border:1px solid #9a8060;border-radius:100%;width:20px;height:20px;background:#fff0ce;color:#645238;font-size:13px;font-weight:800}
.miniRegionName{font-size:11px;font-weight:900;font-family:"KaiTi","Microsoft YaHei",serif;white-space:nowrap;color:#674b30;background:#e4d3adbc;padding:1px 4px;border-radius:4px}
#miniHud.pixel .miniMapIcon{border-radius:3px}
#miniHud.pixel .miniRegionName{font-family:Consolas,"Microsoft YaHei",monospace}
