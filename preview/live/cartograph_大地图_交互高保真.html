<style>

*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:#cfceb9;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #f4cf8c;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}
#mapArea,#map{position:fixed;inset:0;width:100%;height:100%}#mapArea{cursor:grab;touch-action:none;background:#e4d7bb}#mapArea.dragging{cursor:grabbing}#map{display:block;image-rendering:auto}#mapArea:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px #1c2a2226}
#markerLayer{position:absolute;inset:0;pointer-events:none}.marker{position:absolute;transform:translate(-50%,-100%);display:flex;gap:5px;align-items:center;white-space:nowrap;filter:drop-shadow(0 2px 2px #162b2638)}.markIcon{display:flex;align-items:center;justify-content:center;width:26px;height:26px;background:#fdf5e6;border:2px solid #304c45;border-radius:50%;font-size:14px;color:#253e38;box-shadow:0 2px 8px #162b2666}.markLabel{color:#253b34;background:#f7f4e6f0;padding:4px 7px;border-radius:5px;border:1px solid #2943342c;font-size:12px;font-weight:750;letter-spacing:.2px;text-shadow:0 1px #fff5;box-shadow:0 3px 10px #1f2d241b}.marker.ancient .markIcon{background:#eee1bd;border-color:#6a4f39;color:#4a3023}.marker.ancient .markLabel{background:#e9d4a8eb;border-color:#6a4f3960;color:#513c29;font-family:Georgia,"Microsoft YaHei",serif}
.appbar{position:fixed;z-index:5;top:20px;right:22px;display:flex;align-items:center;gap:6px;padding:7px;background:#1b2c24ed;border:1px solid #dfc99c42;border-radius:12px;box-shadow:var(--shadow)}.tool{height:46px;min-width:52px;padding:5px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#eee8d9;background:transparent;border:1px solid transparent;border-radius:8px;font-size:12px;font-weight:650}.tool:hover,.tool.active{background:#4a6252;border-color:#dfc99c38}.tool svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.tool.close{color:#f6d6bc}.sep{height:26px;width:1px;background:#eadcb12e;margin:0 2px}

.overlayWindow{position:fixed;z-index:7;right:22px;top:93px;width:min(350px,calc(100vw - 28px));max-height:min(650px,calc(100vh - 110px));overflow-y:auto;border:1px solid #d8caa05b;border-radius:13px;background:linear-gradient(160deg,#283e33f5,#182b23f7);box-shadow:var(--shadow);padding:19px}.overlayWindow.hidden,.modalBackdrop.hidden,.toast.hidden,.contextMenu.hidden{display:none}.panelLabel{font-size:10px;color:#dfc799;letter-spacing:2.2px;font-weight:800;text-transform:uppercase}.panelTitle{font-size:20px;line-height:1.6;font-weight:800;margin:3px 0}.panelSubtitle{color:#b9c8ba;font-size:12px;line-height:1.8;margin:0 0 12px}.smallClose{position:absolute;right:12px;top:12px;border:0;background:#ffffff12;color:#fff;border-radius:7px;width:28px;height:28px;font-size:19px}.resource{display:grid;grid-template-columns:1fr auto;gap:5px 8px;padding:11px 0;border-bottom:1px solid var(--line)}.resource small{color:#bac7b5;font-size:12px}.resource strong{font-size:14px;color:#f3d399}.btn{border:1px solid #f7d2a93c;background:#435748;color:#f6eddf;padding:10px 14px;border-radius:8px;font-weight:700}.btn:hover{background:#576d59}.btn.primary{background:#dac293;color:#23362b;border-color:#ead4a8}.btn.primary:hover{background:#f4d8a3}.panelGroup{margin-top:14px;display:grid;gap:8px}.panelGroup button{text-align:left;padding:10px 12px}.layerRow{display:flex;align-items:center;justify-content:space-between;padding:12px 3px;gap:14px;border-bottom:1px solid #ffffff14;min-height:48px}.layerRow span{color:#eeeadd;font-size:13px;font-weight:700}.layerRow small{display:block;color:#adbfb2;font-size:11px;margin-top:4px}.layerRow input{accent-color:#eccb88;width:18px;height:18px}.markList{display:flex;flex-direction:column;gap:7px}.markList button{text-align:left;display:flex;align-items:center;gap:9px;border:1px solid #ffffff16;background:#385042;color:#f8edd9;border-radius:8px;padding:10px}.markList button:hover{background:#536e57}.markList b{font-size:13px}.markList small{font-size:10px;color:#bbc7b8;display:block;margin-top:3px}
.modalBackdrop{position:fixed;inset:0;z-index:10;background:#0a1712b8;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}.modal{width:min(780px,100%);max-height:95vh;overflow-y:auto;background:linear-gradient(152deg,#2b4135,#1b3026);border:1px solid #dcc7a874;border-radius:16px;box-shadow:0 30px 90px #000b;padding:27px 28px}.modalHeading{display:flex;justify-content:space-between;gap:15px;align-items:start}.modalHeading h2{font-size:23px;line-height:1.4;margin:4px 0 3px}.modalHeading p{font-size:12px;color:#b8caba;margin:3px 0 0;line-height:1.7}.modalHeading button{background:#ffffff16;color:#fff;border:0;border-radius:7px;font-size:22px;width:32px;height:32px}.settingCaption{color:#f0d29e;font-size:11px;font-weight:850;letter-spacing:1px;margin:24px 0 10px}.styleCards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.styleCard{border:2px solid #ffffff2c;border-radius:11px;overflow:hidden;background:#253c31;color:#fff;text-align:left;padding:0;min-width:0;transition:border .15s,transform .15s}.styleCard:hover{border-color:#c7b38c}.styleCard.chosen{border-color:#eed09a;box-shadow:0 0 0 2px #edcf9b2e}.miniPreview{height:112px;position:relative;overflow:hidden}.miniPreview canvas{height:100%;width:100%;display:block}.miniPreview .chip{position:absolute;top:8px;right:8px;background:#23362bdc;color:#f9eacf;font-size:10px;border-radius:4px;padding:4px 6px}.styleCard strong{display:block;font-size:16px;margin:12px 13px 4px}.styleCard small{display:block;color:#c0cbbf;font-size:11px;line-height:1.7;margin:0 13px 13px;min-height:38px;font-size:12px}.modalFooter{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:21px;border-top:1px solid #ffffff1f;padding-top:18px}.modalFooter small{font-size:11px;color:#becdbb;line-height:1.6}.settingsToggle{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:10px 0;border-bottom:1px solid #ffffff12}.settingsToggle input{accent-color:#efd293}.settingsToggle b{font-size:12px}.settingInput{background:#20362d;border:1px solid #c6b68f7b;border-radius:7px;color:#fff;padding:10px;font-size:14px;width:100%;outline:none}.settingInput:focus{border-color:#f1d6a3}
.toast{position:fixed;z-index:20;left:50%;bottom:35px;transform:translateX(-50%);background:#1e3429f5;border:1px solid #e4d09b80;color:#f5e8d5;box-shadow:var(--shadow);padding:11px 20px;border-radius:10px;max-width:calc(100vw - 30px);font-size:13px;font-weight:650;text-align:center}.mapFlag{position:fixed;z-index:4;left:20px;bottom:20px;color:#f1f1e3;font-size:11px;background:#1b3329bb;border:1px solid #e3d4ba62;border-radius:8px;padding:8px 11px;pointer-events:none;box-shadow:0 5px 25px #20332a42}.mapFlag b{display:block;font-size:12px;margin-bottom:3px;color:#f5d9a4}.contextMenu{position:fixed;z-index:8;background:#20382dcf;color:#f8eee0;padding:6px;border-radius:10px;border:1px solid #f4d3a75a;box-shadow:0 12px 42px #101d18a8;width:176px}.contextMenu button{display:block;width:100%;text-align:left;padding:10px;border:0;border-radius:7px;background:none;color:inherit;font-size:12px}.contextMenu button:hover{background:#ffffff25}
@media(max-width:850px){.appbar{right:8px;top:8px;gap:0;padding:4px}.tool{width:43px;min-width:0;height:45px;font-size:10px;padding:3px}.tool svg{width:17px;height:17px}.overlayWindow{right:8px;top:118px;max-height:calc(100vh - 132px)}.mapFlag{left:8px;bottom:8px;font-size:9px}.modal{padding:18px}.miniPreview{height:92px}}


.marker.pixel .markIcon{border-radius:5px;background:#f3eccf;border:2px solid #263b30;box-shadow:2px 2px 0 #102d2180}.marker.pixel .markLabel{background:#f3eccf;border-radius:1px;border:2px solid #375745;box-shadow:2px 2px 0 #203c2a88;font-family:monospace;font-size:12px}
@media(max-width:940px){.styleCards{grid-template-columns:repeat(3,minmax(0,1fr))}.miniPreview{height:88px}.styleCard strong{font-size:14px}.styleCard small{font-size:11px;min-height:65px}}
@media(max-width:640px){.styleCards{grid-template-columns:1fr}.styleCard{display:grid;grid-template-columns:105px 1fr;grid-template-rows:auto auto;align-items:center}.miniPreview{grid-row:1/3;height:91px}.styleCard strong{margin:8px 10px 0;font-size:15px}.styleCard small{margin:2px 10px 8px;min-height:unset}}
@media(max-width:520px){.tool{width:36px}.tool span{font-size:9px}.styleCards{gap:7px}.styleCard small{font-size:10px}.styleCard strong{font-size:13px}.modalHeading h2{font-size:20px}.overlayWindow{top:111px}}

/* Compass player arrow follows world coordinates, independent of selection. */
.playerArrow{position:fixed;z-index:4;pointer-events:none;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 3px #061b13df)}
.playerArrowTri{width:30px;height:36px;background:#fff8e4;clip-path:polygon(50% 0,95% 100%,50% 74%,5% 100%);transform:rotate(35deg);border:2px solid #213c30}
.playerArrow small{background:#223c2fe8;border:1px solid #d2c39788;color:#fdf3dd;border-radius:5px;font-size:11px;padding:1px 6px;font-weight:800;white-space:nowrap}
.playerArrow.hidden{display:none}
.layerRow:has(input[disabled]){opacity:.58;cursor:default}
/* Distinct cartographic place names, not point-waypoints */
#mapArea.regionDrawing{cursor:crosshair!important}
#mapArea.regionDrawing.dragging{cursor:crosshair!important}
.regionGuide{position:fixed;z-index:8;bottom:27px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 28px);border:1px solid #d9c69c8e;border-radius:13px;background:#203429f0;color:#f8efdc;box-shadow:var(--shadow);padding:10px 13px;backdrop-filter:blur(10px)}
.regionGuide.hidden{display:none}.regionGuide strong{font-size:13px;color:#f5ddb1}.regionGuide small{display:block;margin-top:3px;color:#bfd0c1;font-size:11px;white-space:nowrap}.regionGuide .guideButtons{display:flex;gap:6px;flex-wrap:nowrap}.regionGuide .btn{white-space:nowrap;font-size:12px;padding:8px 11px}.regionGuide .danger{border-color:#b97a68;color:#ffe1cc}
.regionItem{background:#3b5143b5;border:1px solid #ffffff16;border-radius:9px;padding:11px 11px 10px;margin:9px 0}.regionItem.selected{border-color:#e5ca9588;background:#4a5d4a}.regionItemHeader{display:flex;gap:9px;align-items:center}.regionItemColor{width:12px;height:12px;flex-shrink:0;border-radius:50%;border:2px solid #eee1cc}.regionItemHeader b{font-size:14px;color:#f8e9ce;flex:1}.regionItemHeader em{font-size:10px;font-style:normal;color:#c3d4c4;background:#20382db9;border-radius:4px;padding:3px 6px}.regionItemNote{color:#b4c5b9;font-size:11px;margin:8px 0}.regionItemActions{display:flex;gap:5px}.regionItemActions button{border:1px solid #e8d3a536;background:#5a6b53;color:#f9efd8;border-radius:6px;padding:5px 10px;font-size:12px;font-weight:700}.regionItemActions button:last-child{background:#6b4f44}.regionItemActions button:hover{filter:brightness(1.16)}
.regionFormGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.regionFormGrid label{display:block;color:#dfd5bd;font-size:12px;font-weight:700}.regionFormGrid label>.settingInput{margin-top:7px}.regionFormHint{border-left:3px solid #d9bf89;background:#fff2d60a;border-radius:4px;padding:9px 13px;margin-top:17px;color:#c2cdbb;font-size:12px;line-height:1.8}.regionColorInput{height:43px;padding:5px 7px!important}.regionInlineInfo{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:#d0dfc8;margin:7px 0}
@media(max-width:750px){.regionGuide{left:10px;right:10px;bottom:10px;transform:none;flex-wrap:wrap;justify-content:space-between}.regionGuide small{white-space:normal}.regionFormGrid{grid-template-columns:1fr}}

/* 最终原型: 左下角只保留真正有用的简洁状态信息 */
.mapFlag.statusSimple{bottom:18px;left:20px;min-width:258px;max-width:460px;font-size:13px;background:#20382df0;backdrop-filter:blur(10px);padding:11px 14px;border-radius:12px;line-height:1.7}
.statusTop{display:flex;gap:14px;align-items:center}.statusTop strong{color:#edd6a4;font-size:14px}.statusBottom{display:flex;gap:15px;align-items:center;color:#c7d4c5;font-size:11px;flex-wrap:wrap}
.map-center{position:fixed;right:24px;bottom:24px;z-index:6;width:48px;height:48px;border:1px solid #cbb78982;background:#20372aee;border-radius:12px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#f3e5c7}
.map-center:hover{background:#3c5d48}.map-center svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.selectionPoint{position:fixed;z-index:5;pointer-events:none;width:28px;height:28px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #ffe9ae;background:#283e2b66;box-shadow:0 0 0 4px #172a2645,0 0 20px #12272c55}
.selectionPoint span{position:absolute;top:10px;left:10px;width:4px;height:4px;border-radius:50%;background:white}
.detailFloat{position:fixed;z-index:8;width:315px;max-height:calc(100vh - 120px);overflow:auto;min-height:136px;background:linear-gradient(145deg,#283d32f7,#1d3027f9);border:1px solid #dfc99b69;box-shadow:0 14px 45px #0b1716bb;border-radius:14px;padding:18px 18px 15px;color:#f6f0de}
.detailFloat.hidden,.selectionPoint.hidden{display:none}.detailHead{display:flex;justify-content:space-between;align-items:start;gap:10px}.detailHead small{font-weight:800;letter-spacing:1.3px;font-size:10px;color:#e2c895}.detailHead h3{margin:4px 0;font-size:22px}.detailFloat .smallClose{position:relative;right:0;top:0;flex-shrink:0}
.detailFloat p{font-size:13px;line-height:1.7;margin:10px 0;color:#d2ded0}.detailMeta{font-size:12px;color:#dacfb2;border-top:1px solid #f4d6a52f;padding:10px 0}
.detailActions{display:flex;gap:7px;flex-wrap:wrap}.detailActions button{padding:8px 11px;border:1px solid #e0ceaa53;background:#465c49;color:#fff1d7;border-radius:8px;font-size:12px;font-weight:800}.detailActions .delete{background:#73463a}
#markerLayer{pointer-events:none}.marker{pointer-events:auto;cursor:pointer}.marker:hover .markLabel{outline:2px solid #f7dba8}
.miniHudScene{height:340px;position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#89aebd 0%,#b4b9a1 39%,#567652 40%,#55764e 63%,#4b6646 100%);border:1px solid #adc4ab59;touch-action:none;user-select:none}
.miniHudScene:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 24px,#263f2613 24px 27px),repeating-linear-gradient(90deg,transparent 0 26px,#fff3 26px 28px);opacity:.7}
.miniHudScene:after{content:'';position:absolute;bottom:0;left:0;right:0;height:52%;background:linear-gradient(135deg,#2d5d47 0 20%,#4e6b3d 20% 31%,#354f32 31% 45%,#576e40 45% 60%,#36573c 60% 80%,#405e34 80%);clip-path:polygon(0 34%,14% 12%,28% 30%,43% 8%,58% 23%,74% 0,100% 28%,100% 100%,0 100%)}
.miniHud{position:absolute;z-index:2;top:7%;right:3%;height:176px;width:176px;overflow:visible;cursor:grab;filter:drop-shadow(0 6px 13px #0007);touch-action:none}
.miniHud.dragging{cursor:grabbing}.miniMapFace{background:#dfd1aa;height:100%;width:100%;border-radius:8px;overflow:hidden;border:3px solid #172f23ee;position:relative}
.miniHud.round .miniMapFace{border-radius:50%}.miniMapFace canvas{width:100%;height:100%;display:block}.miniPlayer{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(24deg);font-size:23px;color:#fff8dd;text-shadow:0 2px 6px #19372d}
.miniCardinal{position:absolute;z-index:2;font-size:12px;font-weight:900;color:#fff9e6;text-shadow:0 2px 5px #0008;pointer-events:none}
.miniCardinal.n{left:50%;top:5px;transform:translateX(-50%)}.miniCardinal.s{left:50%;bottom:5px;transform:translateX(-50%)}.miniCardinal.w{left:8px;top:50%;transform:translateY(-50%)}.miniCardinal.e{right:8px;top:50%;transform:translateY(-50%)}
.miniResize{position:absolute;right:-12px;bottom:-12px;background:#e8d59b;color:#253a2c;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:19px;cursor:nwse-resize;z-index:4;box-shadow:0 4px 12px #0005}
.miniInfo{position:absolute;top:100%;left:0;margin-top:3px;background:#1b2c25e6;color:#f5eacf;font-size:10px;white-space:nowrap;padding:4px 7px;border-radius:5px;pointer-events:none}
.configRow{display:flex;gap:10px;flex-wrap:wrap}.configRow .btn.active{background:#ddc595;color:#263c31}.miniOptions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.miniOptions label{display:flex;align-items:center;gap:7px;color:#e6eddf;font-size:13px;padding:7px;background:#fff1;border-radius:7px}.miniOptions input{accent-color:#ddc595;width:17px;height:17px}
#miniSizeRange{accent-color:#dcc58e;width:100%}.previewHint{font-size:11px;color:#d0e1d2;line-height:1.7;margin-top:10px}
.materialGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.materialGrid button{text-align:left;padding:12px;line-height:1.8}
.materialGrid small{display:block;color:#b9c5b6;font-weight:400}.settingInput[type="number"]{color-scheme:dark}
@media(max-width:850px){.overlayWindow{top:69px}.map-center{right:12px;bottom:12px}.detailFloat{max-width:calc(100vw - 28px)}.mapFlag.statusSimple{left:8px;bottom:8px;max-width:calc(100vw - 76px)}.miniHudScene{height:220px}}


/* 小地图调整：离开地图进入不可操控的游戏视图，HUD 可拖动 */
.gameAdjust{position:fixed;inset:0;z-index:40;background:#141f18}
.gameAdjust.hidden{display:none}
.gameAdjust iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.gameAdjustTop{position:absolute;left:50%;top:18px;transform:translateX(-50%);border:1px solid #e8d1a355;background:#1c3127ed;color:#f5e8c9;border-radius:12px;padding:12px 20px;text-align:center;font-weight:800;font-size:15px;pointer-events:none;box-shadow:0 6px 25px #06150a99}
.gameAdjustTop small{display:block;color:#d7d4bd;font-size:12px;margin-top:6px;font-weight:400}
.gameAdjustActions{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:12px;padding:9px;background:#1c3127ed;border-radius:12px;box-shadow:0 8px 32px #04180d99}
.gameAdjustActions button{background:#445b4a;color:#fff0ce;border:1px solid #e4c68e4e;border-radius:8px;padding:10px 28px;cursor:pointer;font-weight:800}
.gameAdjustActions .primary{background:#e5c894;color:#263a2f}
/* 顶点调整：冻结圈选后可以抓取点和沿边增点 */
#mapArea.regionAdjust{cursor:default!important}
.regionGuide{z-index:12}
.regionGuide [data-region-action="adjust"].active{background:#ddc595;color:#253b30}
#vertexMenu button{padding:10px 18px;border:0;background:transparent;color:#f3e6cd;cursor:pointer}
#vertexMenu button:hover{background:#4b5744}

.materialSlots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.materialSlots.triple{grid-template-columns:repeat(3,minmax(0,1fr))}

.itemSlot:hover{background:#536e56}.itemSlot.installed{border-color:#e3ca7f}
.itemSlotIcon{width:44px;height:44px;border:2px solid #b8ae8a;display:grid;place-items:center;border-radius:5px;background:#273a2c;font-size:23px;flex-shrink:0}
.itemSlot .dye-red{color:#e2574c}.itemSlot .dye-yellow{color:#f5d35a}.itemSlot .dye-blue{color:#649fe0}
.itemSlot strong{display:block;font-size:13px}.itemSlot small{display:block;font-size:11px;color:#c5d1c0;margin-top:6px;line-height:1.5}
.dyeStatus{padding:10px 13px;background:#244333;border-radius:8px;border-left:3px solid #e6ce90;color:#efe0bb;font-size:13px}
.compassSlot{max-width:340px;margin-top:12px}
@media(max-width:580px){.materialSlots.triple{grid-template-columns:1fr}.materialSlots{grid-template-columns:1fr}}

.costGroup{padding:15px 17px;margin-top:14px;background:#ffffff08;border:1px solid #dfcda838;border-radius:12px}

 $('#regionGuide').querySelector('[data-region-action="finish"]').disabled=n<3;
 $('#regionGuide').querySelector('[data-region-action="finish"]').textContent=regionRedrawingId?'保存边界':'完成圈选';
 $('#regionGuide').querySelector('[data-region-action="undo"]').disabled=n<1;
}
function cancelRegionDrawing(){
 regionDrawing=null;regionPreview=null;regionAdjust=false;regionPointer=null;
 area.classList.remove('regionDrawing','regionAdjust');$('#regionGuide').classList.add('hidden');
 $('#vertexMenu').classList.add('hidden');regionRedrawingId=null;requestRender();
}
function addRegionVertex(x,y){
 if(!regionDrawing||regionAdjust)return;
 const p=[clamp(x,0,W),clamp(y,0,H)];
 if(regionDrawing.length>=64){toast('最多 64 个边界点');return}
 const last=regionDrawing.at(-1);
 if(last&&Math.hypot(p[0]-last[0],p[1]-last[1])<5)return;
 regionDrawing.push(p);updateRegionGuide();requestRender();
}
function finishRegionDrawing(){
 if(!regionDrawing)return;
 if(regionDrawing.length<3){toast('至少需要三个顶点');return}
 if(Math.abs(polygonArea(regionDrawing))<250){toast('区域过小');return}
 const points=regionDrawing.map(p=>p.slice()),editId=regionRedrawingId;
 cancelRegionDrawing();openRegionEditor(editId,points);
}
function closestVertex(clientX,clientY){
 if(!regionDrawing)return -1;
 let idx=-1,min=13*13;
 for(let i=0;i<regionDrawing.length;i++){
   const [x,y]=screenPos(...regionDrawing[i]);const d=(x-clientX)**2+(y-clientY)**2;
   if(d<min){min=d;idx=i}
 }
 return idx;
}
function closestEdge(clientX,clientY){
 if(!regionDrawing||regionDrawing.length<2)return -1;
 let idx=-1,min=11*11;
 for(let i=0;i<regionDrawing.length;i++){
   const a=screenPos(...regionDrawing[i]);const b=screenPos(...regionDrawing[(i+1)%regionDrawing.length]);
   const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;
   if(!l)continue;
   const t=clamp(((clientX-a[0])*dx+(clientY-a[1])*dy)/l,0,1);
   const dd=(a[0]+dx*t-clientX)**2+(a[1]+dy*t-clientY)**2;
   if(dd<min){min=dd;idx=i}
 }
 return idx;
}
function openRegionEditor(id,points){detailClose();panelClose();const region=id?regions.find(r=>r.id===id):null;regionEditId=region?.id||null;const pts=points||region?.points;if(!pts)return;modal='region';const name=region?.name||'',type=region?.type||'other',color=region?.color||regionTypes.other.color;
  modalEl.innerHTML=`<div class="modalHeading"><div><div class="panelLabel">CARTOGRAPH / NAMED REGION</div><h2>${region?'编辑区域名称':'为这片区域命名'}</h2><p>边界顶点 ${pts.length} 个</p></div><button data-act="modal-close">×</button></div><div class="settingCaption">区域名称</div><input class="settingInput" id="regionName" maxlength="24" placeholder="例如：北境海、苍岚山脉、雾松林" value="${escapeHtml(name)}"/><div class="regionFormGrid"><label style="margin-top:17px">地理区域类型<select id="regionType" class="settingInput">${Object.entries(regionTypes).map(([key,v])=>`<option value="${key}" ${key===type?'selected':''}>${v.name}</option>`).join('')}</select></label><label style="margin-top:17px">注记颜色<input class="settingInput regionColorInput" type="color" id="regionColor" value="${escapeHtml(color)}"/></label></div>${region?`<div style="margin-top:15px"><button class="btn" data-region-action="redraw" data-region-id="${escapeHtml(region.id)}">调整边界 · ${pts.length} 个顶点</button></div>`:''}<div class="settingCaption">区域简介 / 备注</div><input class="settingInput" id="regionNote" maxlength="160" value="${escapeHtml(region?.note||'')}" placeholder="例如：沿岸深海、林区或山脉简介"><div class="regionFormHint"></div><div class="modalFooter"><small></small><div style="display:flex;gap:9px"><button class="btn" data-act="modal-close">取消</button><button class="btn primary" data-region-action="save">保存区域</button></div></div>`;
  modalEl.dataset.regionPoints=JSON.stringify(pts);backdrop.classList.remove('hidden');setTimeout(()=>$('#regionName')?.focus(),0);
}
function saveRegionEditor(){const name=$('#regionName')?.value?.trim(),type=$('#regionType')?.value||'other',color=$('#regionColor')?.value||regionTypes.other.color;if(!name){toast('请输入区域名称');$('#regionName')?.focus();return}if(!regionTypes[type]){toast('无效区域类型');return}let pts;try{pts=JSON.parse(modalEl.dataset.regionPoints)}catch{return}if(!Array.isArray(pts)||pts.length<3)return;
 const existing=regionEditId?regions.find(r=>r.id===regionEditId):null;
 if(existing){existing.name=name;existing.type=type;existing.color=color;existing.points=pts;existing.note=$('#regionNote')?.value||'';delete existing.label;selectedRegionId=existing.id}
 else{if(regions.length>=80){toast('最多支持 80 个区域');return}const region={id:'region-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),name,type,color,points:pts,note:$('#regionNote')?.value||''};regions.push(region);selectedRegionId=region.id}
 saveRegions();modalClose();panel='regions';panelEl.classList.remove('hidden');repaintRegionPanel();toast(`区域「${name}」已保存 · 三种地图风格共用`);const saved=regions.find(r=>r.id===selectedRegionId);if(saved)showSelected(regionCenter(saved),saved,{kind:'region'});
}
function handleRegionButton(e){const b=e.target.closest('[data-region-action]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const act=b.dataset.regionAction,id=b.dataset.regionId;
 if(act==='draw')startRegionDrawing();
 else if(act==='redraw'){const item=regions.find(x=>x.id===id);if(item)startRegionDrawing(item.id)}
 else if(act==='finish')finishRegionDrawing();
 else if(act==='adjust'){if(regionDrawing?.length>=3){regionAdjust=!regionAdjust;regionPreview=null;area.classList.toggle('regionAdjust',regionAdjust);updateRegionGuide();requestRender()}}
 else if(act==='undo'){if(regionDrawing?.length){regionDrawing.pop();updateRegionGuide();requestRender()}}
 else if(act==='cancel')cancelRegionDrawing();
 else if(act==='save')saveRegionEditor();
 else if(['focus','edit','delete'].includes(act)){const r=regions.find(x=>x.id===id);if(!r)return;
  if(act==='focus'){[cx,cy]=regionCenter(r);selectedRegionId=r.id;panelClose();requestRender();toast('已定位至「'+r.name+'」')}
  else if(act==='edit')openRegionEditor(id);
  else if(act==='delete'){if(confirm('删除区域「'+r.name+'」？这不会删除任何地图地形或标点。')){regions=regions.filter(x=>x.id!==id);if(selectedRegionId===id)selectedRegionId='';saveRegions();repaintRegionPanel();toast('已删除区域名称')}}
 }
}
function initRegionEvents(){
 document.addEventListener('click',handleRegionButton,true);
 const vm=$('#vertexMenu');
 $('#vertexDelete').addEventListener('click',e=>{
   e.stopPropagation();
   if(regionDrawing&&vertexMenuIndex>=0&&regionDrawing.length>3){
     regionDrawing.splice(vertexMenuIndex,1);updateRegionGuide();requestRender();
   }else if(regionDrawing)toast('区域至少需要三个顶点');
   vertexMenuIndex=-1;vm.classList.add('hidden');
 });
 area.addEventListener('pointerdown',e=>{
   if(!regionDrawing||e.button!==0)return;
   e.preventDefault();e.stopImmediatePropagation();
   detailClose();vm.classList.add('hidden');
   if(regionAdjust){
     const idx=closestVertex(e.clientX,e.clientY);
     if(idx>=0){regionPointer={kind:'vertex',index:idx,id:e.pointerId};area.setPointerCapture(e.pointerId)}
     else{regionPointer={kind:'pan',id:e.pointerId,x:e.clientX,y:e.clientY,cx,cy};area.setPointerCapture(e.pointerId)}
   }else{
     const [x,y]=worldPos(e.clientX,e.clientY);
     if(regionDrawing.length>=3&&Math.hypot(x-regionDrawing[0][0],y-regionDrawing[0][1])*scale<14){regionAdjust=true;regionPreview=null;area.classList.add('regionAdjust');updateRegionGuide();requestRender();return}
     if(e.detail<2)addRegionVertex(x,y);
   }
 },true);
 area.addEventListener('pointermove',e=>{
   if(!regionDrawing)return;
   if(regionPointer?.kind==='vertex'){
     regionDrawing[regionPointer.index]=worldPos(e.clientX,e.clientY).map((v,i)=>clamp(v,0,i?H:W));
     requestRender();e.stopImmediatePropagation();return;
   }
   if(regionPointer?.kind==='pan'){
     cx=regionPointer.cx-(e.clientX-regionPointer.x)/scale;
     cy=regionPointer.cy-(e.clientY-regionPointer.y)/scale;
     requestRender();e.stopImmediatePropagation();return;
   }
   if(!regionAdjust){regionPreview=worldPos(e.clientX,e.clientY);requestRender()}
 },true);
 area.addEventListener('pointerup',e=>{
   if(!regionDrawing||!regionPointer)return;
   if(regionPointer.id===e.pointerId){regionPointer=null;try{area.releasePointerCapture(e.pointerId)}catch(_){}}
   updateRegionGuide();requestRender();e.stopImmediatePropagation();
 },true);
 area.addEventListener('dblclick',e=>{
   if(!regionDrawing)return;
   e.preventDefault();e.stopImmediatePropagation();
   if(!regionAdjust){if(regionDrawing.length>=3){regionAdjust=true;area.classList.add('regionAdjust');updateRegionGuide();requestRender()}return}
   const idx=closestEdge(e.clientX,e.clientY);
   if(idx>=0&&regionDrawing.length<64){regionDrawing.splice(idx+1,0,worldPos(e.clientX,e.clientY));updateRegionGuide();requestRender()}
 },true);
 area.addEventListener('contextmenu',e=>{
   if(!regionDrawing)return;
   e.preventDefault();e.stopImmediatePropagation();
   if(!regionAdjust){if(regionDrawing.length>=3){regionAdjust=true;regionPreview=null;area.classList.add('regionAdjust');updateRegionGuide();requestRender()}return}
   const index=closestVertex(e.clientX,e.clientY);vertexMenuIndex=index;
   if(index>=0){vm.style.left=clamp(e.clientX,9,w-170)+'px';vm.style.top=clamp(e.clientY,9,h-70)+'px';vm.classList.remove('hidden')}
   else vm.classList.add('hidden');
 },true);
 window.addEventListener('keydown',e=>{
   if($('#gameAdjust').classList.contains('hidden')===false){if(e.key==='Escape')stopGameAdjust(false);else if(e.key==='Enter')stopGameAdjust(true);return}
   if(!regionDrawing)return;
   if(e.key==='Escape'){e.preventDefault();cancelRegionDrawing()}
   else if(e.key==='Enter'){e.preventDefault();finishRegionDrawing()}
   else if(e.key==='Backspace'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){
      e.preventDefault();if(regionDrawing.length){regionDrawing.pop();updateRegionGuide();requestRender()}
   }
 },true);
}

function start(){
 initRegionEvents();
 collectGeometry();initMasks();
 realBase=makeRaster('realistic');inkBase=makeRaster('illustrated');
 pixelBase=makePixelRaster(true);pixelClassicBase=makePixelRaster(false);
 let preferred='pixel';
 if(!terrainPreview){
  try{
   const saved=localStorage.getItem('cartograph-final-map-style-v3');
   if(mapStyles.includes(saved))preferred=saved;
  }catch(_){}
 }
 if(preferred==='pixel'){
  scale=Math.min(innerWidth/W,innerHeight/H)*.92;
  cx=W/2;cy=H/2;
 }else{
  scale=Math.max(innerWidth/W,innerHeight/H)*1.08;
  [cx,cy]=PLAYER_MAP;
 }
 rebuild();initEvents();syncSize();setMode(preferred,true);updateStatus();
}
start();
Object.defineProperty(window,'__cartographPreviewState',{
 get:()=>({geometryBuilds,maskUpdates,surveyed:surveyCount,colorized:colorCount,
   total:MASK_COUNT,ink:resources.ink,pigment:resources.pigment,
   permanentInk:costSettings.permanentInk,permanentColor:costSettings.permanentColor,
   masks:{survey:new Uint8Array(visibilityMask),color:new Uint8Array(colorMask)}})
});
})();
</script>
