  <div id="closedLayer" class="closed-layer hidden"><svg style="width:64px;height:64px;color:#cfb17c"><use href="#i-book"/></svg><h2>已返回游戏</h2><p>这是独立 HTML 原型；游戏画面以简化背景代替。</p><button class="btn primary" data-action="reopen"><svg><use href="#i-map"/></svg>重新打开地图（M）</button></div>
</div>
<script>
(()=>{'use strict';
const $=q=>document.querySelector(q), $all=q=>Array.from(document.querySelectorAll(q));
const icon=n=>`<svg aria-hidden="true"><use href="#i-${n}"></use></svg>`;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), hash=(x,y)=>{let n=(x*374761393+y*668265263)|0;n=((n^(n>>>13))*1274126177)|0;return ((n^(n>>>16))>>>0)/4294967295;};
const round1=n=>(Math.round(n*10)/10).toFixed(1);const key=(x,z)=>`${x},${z}`;const pageOf=(b)=>Math.floor(b/128);const chunkOf=b=>Math.floor(b/16);
const icons=['house','flag','mine','star','anchor','pin'];const iconNames=['住处','旗帜','矿区','地标','港口','其他'];const swatches=['#e9dcb8','#e78a65','#e7bf6d','#8eaf84','#80b8c6','#c09cce'];
const structureNames={village:'河谷村庄',outpost:'山脊前哨站',temple:'沙漠神殿',ship:'沉船遗迹',ruins:'废弃传送门'};
const structures=[{id:'village',x:844,z:707,icon:'house'},{id:'outpost',x:594,z:603,icon:'flag'},{id:'temple',x:1049,z:568,icon:'star'},{id:'ship',x:537,z:864,icon:'ship'},{id:'ruins',x:971,z:870,icon:'star'}];
const fresh=()=>({version:4,player:{x:776,z:740},view:{x:786,z:752,zoom:2.35},pages:25,anchor:{x:6,z:5},inkUnlocked:true,colorUnlocked:false,glowUnlocked:false,compassInstalled:true,ink:83,pigment:0,glow:0,pending:{red:0,yellow:0,blue:0},inventory:{ink:7,glow:4,red:2,yellow:2,blue:2,compass:1,emptyMaps:8,filledMaps:0},refill:{ink:128,pigment:128,glow:32},mult:{ink:1,pigment:1,glow:1},layers:{structures:true,roads:true,rails:true,create:true,manual:true},markers:[{id:'demo-harbor',x:815,z:790,name:'河谷营地',icon:'house',color:0,glowing:false,glowEverPaid:false},{id:'demo-mine',x:1006,z:706,name:'东山矿区',icon:'mine',color:0,glowing:false,glowEverPaid:false}],surveyed:[],colored:[],generated:[],terrainPatches:[],revision:0});
let state=fresh();try{const saved=JSON.parse(localStorage.getItem('cartograph_hifi_01')||'null');if(saved&&saved.version===4)state={...fresh(),...saved,inventory:{...fresh().inventory,...saved.inventory},layers:{...fresh().layers,...saved.layers},mult:{...fresh().mult,...saved.mult},refill:{...fresh().refill,...saved.refill}};}catch(e){}
let generated=new Set(state.generated||[]),surveyed=new Set(state.surveyed||[]),colored=new Set(state.colored||[]);
let panel='', modal='', mapMenu=null, materialExpanded=false, markerQuery='', selectedMarkerId='', lastHover={x:0,y:0}, drag=null;
let tileCache=new Map(), tileRevision=0, canvas=$('#world'), ctx=canvas.getContext('2d',{alpha:false}), screenW=0,screenH=0,dpr=1, raf=0, saveTimeout=0, toastTimeout=0;
const mapLayer=$('#mapLayer'),markersEl=$('#mapMarkers');
// A realistic pre-existing demo world. It is never read from a real seed or world save.
if(generated.size===0){for(let dz=-19;dz<=19;dz++)for(let dx=-25;dx<=25;dx++)if((dx*dx)/(25*25)+(dz*dz)/(19*19)<(0.92+0.09*Math.sin(dx*.8+dz*.4))){let c=key(chunkOf(776)+dx,chunkOf(740)+dz);generated.add(c);surveyed.add(c);}}
function save(){clearTimeout(saveTimeout);saveTimeout=setTimeout(()=>{try{localStorage.setItem('cartograph_hifi_01',JSON.stringify({...state,generated:[...generated],surveyed:[...surveyed],colored:[...colored]}));}catch(e){}},240);}
function toast(msg){const el=$('#toast');el.innerHTML=msg;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),3000);}
function pageSpiral(n){if(n===0)return [0,0];let x=0,z=0,step=1,i=0;while(true){for(let k=0;k<step;k++){x++;if(++i===n)return [x,z]}for(let k=0;k<step;k++){z++;if(++i===n)return [x,z]}step++;for(let k=0;k<step;k++){x--;if(++i===n)return [x,z]}for(let k=0;k<step;k++){z--;if(++i===n)return [x,z]}step++;}}
const coveredPages=new Set(Array.from({length:state.pages},(_,i)=>{const [dx,dz]=pageSpiral(i);return key(state.anchor.x+dx,state.anchor.z+dz)}));
function isCoveredBlock(wx,wz){return coveredPages.has(key(pageOf(wx),pageOf(wz)))}
function isGenerated(wx,wz){return generated.has(key(chunkOf(wx),chunkOf(wz)))}
function isSurveyed(wx,wz){return surveyed.has(key(chunkOf(wx),chunkOf(wz)))}
function isVisibleArea(wx,wz){return isCoveredBlock(wx,wz)&&isGenerated(wx,wz)&&isSurveyed(wx,wz)}
function trySurvey(cx,cz){const k=key(cx,cz);if(surveyed.has(k))return true;const wx=cx*16,wz=cz*16;if(!generated.has(k)||!isCoveredBlock(wx,wz)||!state.inkUnlocked||state.ink<state.mult.ink)return false;state.ink=Math.max(0,+(state.ink-state.mult.ink).toFixed(3));surveyed.add(k);save();return true}
function tryColorize(cx,cz){const k=key(cx,cz);if(colored.has(k))return true;if(!state.colorUnlocked||!surveyed.has(k)||state.pigment<state.mult.pigment)return false;state.pigment=Math.max(0,+(state.pigment-state.mult.pigment).toFixed(3));colored.add(k);save();return true}
function bump(){tileCache.clear();tileRevision++;render();save()}
const coords=(wx,wz)=>({sx:(wx-state.view.x)*state.view.zoom+screenW/2,sy:(wz-state.view.z)*state.view.zoom+screenH/2});
const fromScreen=(sx,sy)=>({x:(sx-screenW/2)/state.view.zoom+state.view.x,z:(sy-screenH/2)/state.view.zoom+state.view.z});
function surface(wx,wz){const n=Math.sin(wx*.025)*.21+Math.cos(wz*.018)*.24+Math.sin((wx+wz)*.012)*.15+Math.cos((wx-wz)*.034)*.085+Math.sin(wx*.073+wz*.069)*.043;
const riverX=772+94*Math.sin(wz*.0098)+26*Math.sin(wz*.025);const river=Math.abs(wx-riverX)<(5+2*Math.sin(wz*.04));const lake=((wx-586)/76)**2+((wz-866)/55)**2<1;const ocean=wx<466+41*Math.sin(wz*.014);
const sand=((wx-1020)/200)**2+((wz-555)/172)**2<1;const high=n>.36;const forest=(Math.sin(wx*.015+wz*.01)+Math.sin(wz*.035-wx*.007))>.55;const water=river||lake||ocean||n<-.38;
let biome=water?'water':sand?'sand':high?'stone':forest?'forest':'grass';
for(const patch of state.terrainPatches){const d=(wx-patch.x)**2+(wz-patch.z)**2;if(d<patch.radius*patch.radius)biome=patch.type;}
return {biome,n,wood:forest,river};}
const palettes={water:[51,93,110],sand:[206,183,132],stone:[143,146,135],forest:[83,125,91],grass:[135,160,113],lake:[54,112,145],build:[167,137,104]};
function pixelColor(wx,wz,hasColor){const t=surface(wx,wz);const noise=(hash(wx|0,wz|0)-.5)*21;const contour=Math.abs((t.n+1)*53%9-4.5)<.36;
if(!hasColor){const water=t.biome==='water'||t.biome==='lake';const dither=hash((wx+13)|0,(wz-8)|0);let dark=water||t.biome==='forest'&&dither>.35||t.biome==='stone'&&dither>.7||contour&&dither>.18||t.biome==='build'&&dither>.25;
if(t.biome==='sand'&&dither>.975)dark=true;const v=dark?38:238;return [v, v===38?42:228, v===38?38:208];}
const p=palettes[t.biome]||palettes.grass;let shade=noise+(contour?-15:0);return [clamp(p[0]+shade,0,255),clamp(p[1]+shade,0,255),clamp(p[2]+shade,0,255)];}
function createTile(px,pz){const off=document.createElement('canvas');off.width=128;off.height=128;const c=off.getContext('2d',{alpha:false});const img=c.createImageData(128,128);let x0=px*128,z0=pz*128;let cc=0;for(let cz=0;cz<8;cz++)for(let cx=0;cx<8;cx++){let X=chunkOf(x0)+cx,Z=chunkOf(z0)+cz;const k=key(X,Z);if(generated.has(k)&&isCoveredBlock(x0+cx*16,z0+cz*16)){trySurvey(X,Z);if(state.colorUnlocked)tryColorize(X,Z);cc++}}
for(let z=0;z<128;z++)for(let x=0;x<128;x++){const wx=x0+x,wz=z0+z,idx=(z*128+x)*4;

const color=pixelColor(wx,wz,colored.has(key(chunkOf(wx),chunkOf(wz))));img.data[idx]=color[0];img.data[idx+1]=color[1];img.data[idx+2]=color[2];img.data[idx+3]=255;}
c.putImageData(img,0,0);return off;}
function getTile(px,pz){const k=key(px,pz)+':'+tileRevision;if(tileCache.has(k))return tileCache.get(k);const tile=createTile(px,pz);tileCache.set(k,tile);if(tileCache.size>70)tileCache.delete(tileCache.keys().next().value);return tile}
function routeZ(type,x){if(type==='road')return 735+24*Math.sin(x/105);if(type==='rail')return 840+11*Math.sin(x/90);return 678+55*Math.sin(x/170)+11*Math.sin(x/32)}
function drawRoute(type,color){const step=Math.max(.8,Math.min(4,2/state.view.zoom));let started=false;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=type==='road'?state.view.zoom*2.5:state.view.zoom*1.5;ctx.lineCap='round';ctx.beginPath();const wMin=state.view.x-screenW/(2*state.view.zoom)-10,wMax=state.view.x+screenW/(2*state.view.zoom)+10;
for(let x=wMin;x<=wMax;x+=step){let z=routeZ(type,x);if(isVisibleArea(x,z)){const p=coords(x,z);if(!started)ctx.moveTo(p.sx,p.sy);else ctx.lineTo(p.sx,p.sy);started=true}else if(started){ctx.stroke();ctx.beginPath();started=false}}ctx.stroke();

function mapPaint(){dpr=Math.min(2,window.devicePixelRatio||1);const w=Math.max(1,window.innerWidth),h=Math.max(1,window.innerHeight);if(w!==screenW||h!==screenH||canvas.width!==Math.ceil(w*dpr)){screenW=w;screenH=h;canvas.width=Math.ceil(w*dpr);canvas.height=Math.ceil(h*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#e9ddc1';ctx.fillRect(0,0,w,h);
const zoom=state.view.zoom,minX=pageOf(state.view.x-w/(2*zoom))-1,maxX=pageOf(state.view.x+w/(2*zoom))+1,minZ=pageOf(state.view.z-h/(2*zoom))-1,maxZ=pageOf(state.view.z+h/(2*zoom))+1;
for(let pz=minZ;pz<=maxZ;pz++)for(let px=minX;px<=maxX;px++){const t=getTile(px,pz),q=coords(px*128,pz*128);ctx.drawImage(t,Math.round(q.sx),Math.round(q.sy),Math.ceil(128*zoom)+1,Math.ceil(128*zoom)+1)}
if(state.layers.roads)drawRoute('road',state.colorUnlocked?'#96794f':'#383832');if(state.layers.rails)drawRoute('rail',state.colorUnlocked?'#3e4d4b':'#363b37');if(state.layers.create)drawRoute('create',state.colorUnlocked?'#ac8567':'#4a5149');
// A subtle parchment texture is drawn on the background, never blurred by the GUI.
ctx.fillStyle='rgba(115,82,43,.045)';for(let x=8;x<w;x+=91){let y=12+(x*29)%101;ctx.fillRect(x,y,1,1)}
renderMarkers();}
function renderMarkers(){const parts=[];function point(x,z,label,symbol,extra='',color='#f1d4a0',large=false){const q=coords(x,z),visible=q.sx>-110&&q.sx<screenW+110&&q.sy>-60&&q.sy<screenH+60;if(!visible)return;parts.push(`<div class="map-point ${extra} ${state.view.zoom<1.4?'minimal':''}" style="left:${q.sx}px;top:${q.sy}px"><div class="pin-head" style="${extra.includes('user')?`background:${color}`:''}">${icon(symbol)}</div><span class="pin-label">${esc(label)}</span></div>`)}
if(state.layers.structures)for(const s of structures)if(isVisibleArea(s.x,s.z))point(s.x,s.z,structureNames[s.id],s.icon,'poi');
if(state.layers.manual)for(const m of state.markers)if(isVisibleArea(m.x,m.z))point(m.x,m.z,m.name,icons[m.icon],`user ${m.glowing?'glowing':''}`,state.colorUnlocked?swatches[m.color]:swatches[0]);

function renderToolbar(){for(const b of $all('.toolbar .tool')){const a=b.dataset.action;b.classList.toggle('active',(a==='panel-'+panel)&&panel!=='');}}

function header(eye,title,desc=''){return `<div class="panel-head"><div><div class="eyebrow">${eye}</div><h2>${title}</h2>${desc?`<p>${desc}</p>`:''}</div><button class="xsmall" data-action="close-panel" aria-label="关闭">${icon('x')}</button></div>`}

function renderPanel(){const el=$('#floatingPanel');if(!panel){el.classList.add('hidden');return;}el.classList.remove('hidden');let html='';
if(panel==='resources'){
const dyeNames=['red','yellow','blue'],dyeIcons=['🔴','🟡','🔵'];const mats=[['ink','墨囊','✒️'],['glow','荧光墨囊','✨'],['red','红色染料',dyeIcons[0]],['yellow','黄色染料',dyeIcons[1]],['blue','蓝色染料',dyeIcons[2]]];
html=header('ATLAS · 01','地图册 · 资源','只在首次测绘及首次上色时扣费；已有区域变化不再消耗材料。')+`<div class="metric-list">${resourceMeter('墨水',state.ink,'',128)}${resourceMeter('颜料',state.pigment,'pigment',128)}${resourceMeter('发光墨水',state.glow,'glow',32)}</div><div class="rule"></div><div class="section-caption">耗材填入口 <span>通用槽</span></div><button class="slot" data-action="material-toggle"><span class="slot-icon">${icon('drop')}</span><span><b>放入材料</b><small>墨囊 / 发光墨囊 / 三原色</small></span><span class="end">${materialExpanded?'收起':'＋'}</span></button>`;

}
if(panel==='markers'){

if(panel==='layers'){

el.innerHTML=html;}
function closeContext(){$('#contextMenu').classList.add('hidden');mapMenu=null;}
function findNearbyMarker(sx,sy){if(!state.layers.manual)return null;let best=null,dist=Infinity;for(const m of state.markers){if(!isVisibleArea(m.x,m.z))continue;const q=coords(m.x,m.z),d=Math.hypot(q.sx-sx,q.sy-sy);if(d<21&&d<dist){best=m;dist=d;}}return best}
function contextAt(sx,sy){closePanel();const p=fromScreen(sx,sy),wx=Math.floor(p.x),wz=Math.floor(p.z);const near=findNearbyMarker(sx,sy);mapMenu={sx,sy,x:near?near.x:wx,z:near?near.z:wz,markerId:near?.id||''};
let txt=near?`<div class="ctx-head">${esc(near.name)}</div><button class="ctxbtn" data-action="ctx-edit">${icon('edit')}编辑标点</button><button class="ctxbtn danger" data-action="ctx-delete">${icon('trash')}删除标点</button>`:`<div class="ctx-head">X ${wx} · Z ${wz}${!isVisibleArea(wx,wz)?' · 未测绘':''}</div><button class="ctxbtn" data-action="ctx-add" ${!isVisibleArea(wx,wz)?'disabled':''}>${icon('plus')}添加标点</button><button class="ctxbtn" data-action="ctx-export" ${!isVisibleArea(wx,wz)?'disabled':''}>${icon('map')}取出地图</button>`;
const el=$('#contextMenu');el.innerHTML=txt;el.classList.remove('hidden');const left=clamp(sx+10,8,screenW-194),top=clamp(sy+10,8,screenH-(near?148:150));el.style.left=left+'px';el.style.top=top+'px';}
function closeModal(){modal='';$('#modalMask').classList.add('hidden');$('#modal').innerHTML='';}
function openMarkerEditor(id='',at=null){closePanel();closeContext();const obj=state.markers.find(m=>m.id===id);const point=at||obj||{x:Math.floor(state.view.x),z:Math.floor(state.view.z)};
if(!obj&&!isVisibleArea(point.x,point.z)){toast('只能在已生成、已测绘的区域添加标点');return;}
modal='marker';selectedMarkerId=id;const name=obj?.name||'',symbol=obj?.icon||0,col=obj?.color||0,glowing=obj?.glowing||false;
const html=`<div class="modal-head"><div><div class="eyebrow">WAYPOINT · ${obj?'EDIT':'NEW'}</div><h2 class="modal-title">${obj?'编辑标点':'添加地图标点'}</h2></div><button class="xsmall" data-action="close-modal">${icon('x')}</button></div><p class="modal-sub">位置 X ${point.x} · Z ${point.z}<br>标点仅记录在这本地图册中，编辑已付费标点不会重复消耗发光墨水。</p><div class="form-group"><label class="form-label" for="markerName">标点名称</label><input class="form-field" id="markerName" maxlength="20" placeholder="例如：河谷营地" value="${esc(name)}"></div><div class="form-group"><div class="form-label">选择图标</div><div class="icon-options" id="iconChoices">${icons.map((ic,i)=>`<button class="icon-option ${symbol===i?'selected':''}" data-icon="${i}" title="${iconNames[i]}">${icon(ic)}<span>${iconNames[i]}</span></button>`).join('')}</div></div><div class="form-group"><div class="form-label">标点颜色</div><div class="color-options" id="colorChoices">${swatches.map((c,i)=>`<button class="swatch ${col===i?'selected':''}" data-color="${i}" style="background:${c}" aria-label="颜色${i+1}" ${!state.colorUnlocked?'disabled':''}></button>`).join('')}</div><div class="hint-row">${state.colorUnlocked?'可自由调整颜色':'投入红、黄、蓝完整三原色后才能更换颜色'}</div></div><div class="check-box-row"><div><strong>发光标点 ${icon('sparkles')}</strong><small>首次开启消耗 ${round1(state.mult.glow)} 点发光墨水<br>已有发光标点调整不重复扣费</small></div><input class="switch" type="checkbox" id="markerGlow" ${glowing?'checked':''}></div><div class="modal-footer"><button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="save-marker">保存标点 ${icon('check')}</button></div>`;
$('#modal').innerHTML=html;$('#modal').dataset.x=point.x;$('#modal').dataset.z=point.z;$('#modal').dataset.icon=symbol;$('#modal').dataset.color=col;$('#modal').dataset.markerid=id;$('#modalMask').classList.remove('hidden');setTimeout(()=>$('#markerName')?.focus(),20);}
function openSettings(){closePanel();closeContext();modal='settings';$('#modalMask').classList.remove('hidden');$('#modal').classList.add('large');$('#modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">CONFIGURATION · 0–10×</div><h2 class="modal-title">模组设置</h2></div><button class="xsmall" data-action="close-modal">${icon('x')}</button></div><p class="modal-sub">三个资源消耗倍率独立控制。设为 0 表示不消耗，但仍需要先插入对应材料解锁能力。此处为高保真交互演示。</p>${[['ink','墨水消耗倍率'],['pigment','颜料消耗倍率'],['glow','发光墨水消耗倍率']].map(([k,n])=>`<div class="setting-row"><div class="setting-heading"><b>${n}</b><span class="setting-value" id="rateText-${k}">${round1(state.mult[k])}×</span></div><input class="range" data-rate="${k}" type="range" min="0" max="10" step="0.1" value="${state.mult[k]}"><div class="range-end"><span>0 = 不消耗</span><span>1 = 默认</span><span>10 = 十倍消耗</span></div></div>`).join('')}<div class="rule"></div><div class="section-caption">填充材料增加的资源量</div>${[['ink','每个墨囊增加墨水'],['pigment','每组三原色增加颜料'],['glow','每个荧光墨囊增加发光墨水']].map(([k,n])=>`<div class="stepper"><label for="refill-${k}">${n}</label><input type="number" min="1" max="10000" step="1" id="refill-${k}" value="${state.refill[k]}"></div>`).join('')}<div class="modal-footer"><button class="btn ghost" data-action="reset-settings">恢复默认</button><button class="btn ghost" data-action="close-modal">取消</button><button class="btn primary" data-action="save-settings">应用设置 ${icon('check')}</button></div>`;}
function consume(mat){if(!(mat in state.inventory)||state.inventory[mat]<=0){toast('背包里没有这种材料');return;}const inv=state.inventory;inv[mat]--;
if(mat==='ink'){state.ink+=state.refill.ink;state.inkUnlocked=true;toast(`已补充 ${state.refill.ink} 点墨水`)}
else if(mat==='glow'){state.glow+=state.refill.glow;state.glowUnlocked=true;toast(`已补充 ${state.refill.glow} 点发光墨水`)}
else{state.pending[mat]++;let sets=Math.min(state.pending.red,state.pending.yellow,state.pending.blue);if(sets>0){for(const k of ['red','yellow','blue'])state.pending[k]-=sets;state.pigment+=state.refill.pigment*sets;state.colorUnlocked=true;toast(`三原色齐全：已补充 ${sets*state.refill.pigment} 点颜料，解锁彩色绘制`)}else toast('染料已暂存；集齐红、黄、蓝才能补充颜料')}
bump();renderPanel();}
function toggleCompass(){if(state.compassInstalled){state.compassInstalled=false;state.inventory.compass++;toast('已取出指南针，地图不再显示玩家位置')}else if(state.inventory.compass>0){state.inventory.compass--;state.compassInstalled=true;toast('指南针已安装，玩家位置已显示')}else toast('背包中没有指南针');save();renderPanel();render()}
function commitMarker(){const n=$('#markerName')?.value.trim()||'未命名标点';const id=$('#modal').dataset.markerid;const original=state.markers.find(m=>m.id===id);const x=Number($('#modal').dataset.x),z=Number($('#modal').dataset.z),glow=$('#markerGlow').checked;
let glowEverPaid=Boolean(original?.glowEverPaid);if(glow&&!glowEverPaid){if(!state.glowUnlocked){toast('需要先投入荧光墨囊解锁发光标点');return;}if(state.glow+1e-9<state.mult.glow){toast('发光墨水不足，请先补充');return;}state.glow=Math.max(0,+(state.glow-state.mult.glow).toFixed(3));glowEverPaid=true;}
const obj={id:id||'mark-'+Date.now(),name:n.slice(0,20),x,z,icon:Number($('#modal').dataset.icon),color:state.colorUnlocked?Number($('#modal').dataset.color):0,glowing:glow,glowEverPaid};if(original)Object.assign(original,obj);else state.markers.push(obj);closeModal();bump();renderPanel();toast(original?'标点已更新（未重复扣除耗材）':'标点已创建');}
function deleteMarker(id){const index=state.markers.findIndex(m=>m.id===id);if(index<0)return;const name=state.markers[index].name;state.markers.splice(index,1);closeContext();bump();renderPanel();toast(`已删除「${esc(name)}」`);}
function exportMap(x,z){if(!isVisibleArea(x,z)){toast('该位置未测绘，不能取出地图');return;}if(state.inventory.emptyMaps<=0){toast('需要背包中有 1 张原版空地图');return;}state.inventory.emptyMaps--;state.inventory.filledMaps++;closeContext();save();renderPanel();toast('拓印完成：消耗 1 张空地图，地图册原页保留');}
function simulateTerrain(){const loc={x:Math.floor(state.view.x)+24,z:Math.floor(state.view.z)+21,radius:25,type:['lake','forest','build','grass'][state.terrainPatches.length%4]};if(!isVisibleArea(loc.x,loc.z)){loc.x=state.player.x+35;loc.z=state.player.z+14;}const before=JSON.stringify([state.ink,state.pigment]);state.terrainPatches.push(loc);state.revision++;bump();toast('地表已模拟改造，已付费区域地图免费更新'+(before===JSON.stringify([state.ink,state.pigment])?' ✓':''));}
function simulateChunk(){const midX=chunkOf(state.view.x),midZ=chunkOf(state.view.z);let target=null;outer:for(let ring=1;ring<35;ring++)for(let dz=-ring;dz<=ring;dz++)for(let dx=-ring;dx<=ring;dx++){if(Math.max(Math.abs(dx),Math.abs(dz))!==ring)continue;let cx=midX+dx,cz=midZ+dz;if(coveredPages.has(key(pageOf(cx*16),pageOf(cz*16)))&&!generated.has(key(cx,cz))){target={cx,cz};break outer}}
if(!target){toast('当前地图页附近没有待生成区块（演示）');return;}const {cx,cz}=target;generated.add(key(cx,cz));const charged=trySurvey(cx,cz);if(charged&&state.colorUnlocked)tryColorize(cx,cz);state.view.x=cx*16+8;state.view.z=cz*16+8;bump();toast(charged?'已生成并首次测绘新区块：按倍率消耗资源':'新区块已生成，但墨水不足或未解锁，保持空白');}
function resetDemo(){try{localStorage.removeItem('cartograph_hifi_01')}catch(e){}state=fresh();generated=new Set();surveyed=new Set();colored=new Set();for(let dz=-19;dz<=19;dz++)for(let dx=-25;dx<=25;dx++)if((dx*dx)/(25*25)+(dz*dz)/(19*19)<(0.92+.09*Math.sin(dx*.8+dz*.4))){let c=key(chunkOf(776)+dx,chunkOf(740)+dz);generated.add(c);surveyed.add(c);}tileCache.clear();tileRevision++;closePanel();closeModal();render();toast('已重置为初始黑白地图册演示');}
function dispatch(action,el){switch(action){case 'panel-resources':openPanel('resources');break;case 'panel-markers':openPanel('markers');break;case 'panel-layers':openPanel('layers');break;case 'panel-info':openPanel('info');break;case 'close-panel':closePanel();break;case 'material-toggle':materialExpanded=!materialExpanded;renderPanel();break;case 'refill':consume(el.dataset.mat);break;case 'compass':toggleCompass();break;case 'center':state.view.x=state.player.x;state.view.z=state.player.z;closePanel();render();save();break;case 'settings':openSettings();break;case 'close-modal':closeModal();break;case 'reset-settings':$all('[data-rate]').forEach(a=>{a.value=1;$('#rateText-'+a.dataset.rate).textContent='1.0×'});for(const k of ['ink','pigment','glow'])$('#refill-'+k).value=({ink:128,pigment:128,glow:32})[k];break;case 'save-settings':for(const a of $all('[data-rate]'))state.mult[a.dataset.rate]=Number(a.value);for(const k of ['ink','pigment','glow'])state.refill[k]=clamp(Number($('#refill-'+k).value)||1,1,10000);save();closeModal();bump();toast('资源消耗设置已应用');break;case 'ctx-add':if(mapMenu)openMarkerEditor('',{x:mapMenu.x,z:mapMenu.z});break;case 'ctx-edit':if(mapMenu?.markerId)openMarkerEditor(mapMenu.markerId);break;case 'ctx-delete':if(mapMenu?.markerId)deleteMarker(mapMenu.markerId);break;case 'ctx-export':if(mapMenu)exportMap(mapMenu.x,mapMenu.z);break;case 'edit-marker':openMarkerEditor(el.dataset.id);break;case 'go-marker':{const m=state.markers.find(m=>m.id===el.dataset.id);if(m){state.view.x=m.x;state.view.z=m.z;render();toast(`已定位：${esc(m.name)}`)}break;}case 'save-marker':commitMarker();break;case 'demo-terrain':simulateTerrain();break;case 'demo-chunk':simulateChunk();break;case 'reset-demo':resetDemo();break;case 'close':closePanel();closeContext();closeModal();$('#closedLayer').classList.remove('hidden');break;case 'reopen':$('#closedLayer').classList.add('hidden');render();break;}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.stopPropagation();dispatch(el.dataset.action,el);return;}if(mapMenu&&!event.target.closest('#contextMenu'))closeContext();});
document.addEventListener('input',event=>{const el=event.target;if(el.matches('[data-rate]'))$('#rateText-'+el.dataset.rate).textContent=round1(Number(el.value))+'×';if(el.id==='markerSearch'){markerQuery=el.value;const f=state.markers.filter(m=>m.name.includes(markerQuery));const out=$('#markerList');if(out)out.innerHTML=f.map(m=>`<div class="item-row"><span class="label-dot">${icon(icons[m.icon])}</span><div style="flex:1"><div class="item-title">${esc(m.name)}</div><small>X ${m.x} · Z ${m.z}</small></div><div class="mini-actions"><button class="btn tiny ghost" data-action="go-marker" data-id="${m.id}">${icon('target')}</button><button class="btn tiny ghost" data-action="edit-marker" data-id="${m.id}">${icon('edit')}</button></div></div>`).join('')||'<p class="tiny-note">没有找到标点。</p>';}});
document.addEventListener('change',event=>{const el=event.target;if(el.matches('[data-layer]')){state.layers[el.dataset.layer]=el.checked;save();render();}});
document.addEventListener('click',event=>{if(event.target.closest('[data-icon]')){const i=Number(event.target.closest('[data-icon]').dataset.icon);$('#modal').dataset.icon=i;$all('[data-icon]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.icon)===i));}if(event.target.closest('[data-color]')){const i=Number(event.target.closest('[data-color]').dataset.color);$('#modal').dataset.color=i;$all('[data-color]').forEach(b=>b.classList.toggle('selected',Number(b.dataset.color)===i));}});
mapLayer.addEventListener('contextmenu',event=>{event.preventDefault();if(!$('#closedLayer').classList.contains('hidden'))return;contextAt(event.clientX,event.clientY)});
mapLayer.addEventListener('pointerdown',event=>{if(event.button!==0)return;closeContext();closePanel();drag={id:event.pointerId,startX:event.clientX,startY:event.clientY,x:state.view.x,z:state.view.z};mapLayer.setPointerCapture(event.pointerId);mapLayer.classList.add('dragging');});
mapLayer.addEventListener('pointermove',event=>{lastHover={x:event.clientX,y:event.clientY};const pos=fromScreen(event.clientX,event.clientY);const out=$('#hoverInfo');out.classList.remove('hidden');out.innerHTML=`X ${Math.floor(pos.x)} · Z ${Math.floor(pos.z)} <span class="status">${!isCoveredBlock(pos.x,pos.z)?'地图册尚未覆盖':!isGenerated(pos.x,pos.z)?'未生成区块':!isSurveyed(pos.x,pos.z)?'未测绘区块':'已测绘 · 免费动态更新'}</span>`;if(drag&&drag.id===event.pointerId){state.view.x=drag.x-(event.clientX-drag.startX)/state.view.zoom;state.view.z=drag.z-(event.clientY-drag.startY)/state.view.zoom;render();}});
mapLayer.addEventListener('pointerup',event=>{if(drag&&drag.id===event.pointerId){drag=null;mapLayer.classList.remove('dragging');save();}});
mapLayer.addEventListener('pointercancel',()=>{drag=null;mapLayer.classList.remove('dragging')});
mapLayer.addEventListener('pointerleave',()=>$('#hoverInfo').classList.add('hidden'));
mapLayer.addEventListener('wheel',event=>{event.preventDefault();const before=fromScreen(event.clientX,event.clientY);state.view.zoom=clamp(state.view.zoom*Math.exp(-event.deltaY*.0015),.9,5.5);state.view.x=before.x-(event.clientX-screenW/2)/state.view.zoom;state.view.z=before.z-(event.clientY-screenH/2)/state.view.zoom;render();save()},{passive:false});
$('#modalMask').addEventListener('pointerdown',event=>{if(event.target===$('#modalMask'))closeModal()});
window.addEventListener('keydown',event=>{if((event.key==='m'||event.key==='M')&&!event.ctrlKey&&!event.altKey&&!event.metaKey&&event.target.tagName!=='INPUT'){event.preventDefault();if(!$('#closedLayer').classList.contains('hidden'))$('#closedLayer').classList.add('hidden');else if(modal)closeModal();else{closeContext();closePanel();}render();}if(event.key==='Escape'){if(modal)closeModal();else if(mapMenu)closeContext();else if(panel)closePanel();else $('#closedLayer').classList.remove('hidden');}});
window.addEventListener('resize',render);
render();setTimeout(()=>toast('高保真交互原型 · 地图全屏，操作改为悬浮窗和弹窗'),480);
// Expose a read-only diagnostic snapshot for automated UI acceptance tests.
window.cartographDemo={snapshot:()=>({pages:state.pages,ink:state.ink,pigment:state.pigment,glow:state.glow,colorUnlocked:state.colorUnlocked,compassInstalled:state.compassInstalled,markers:state.markers.map(m=>({...m})),inventory:{...state.inventory},surveyedCount:surveyed.size,coloredCount:colored.size,layerFlags:{...state.layers},view:{...state.view}})};
})();
</script>
</body>
