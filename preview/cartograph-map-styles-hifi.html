<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),all=s=>Array.from(document.querySelectorAll(s));

const icons={home:'⌂',port:'⚓',mine:'◆',tower:'♜',star:'✦',camp:'⚑'};
const structures=[{x:780,y:420,name:'白河镇',type:'home'},{x:365,y:642,name:'北湾港',type:'port'},{x:1020,y:286,name:'高岭矿区',type:'mine'},{x:890,y:685,name:'古堡遗址',type:'tower'},{x:603,y:253,name:'湖畔村',type:'home'}];

const roadA=[[350,647],[406,608],[469,550],[557,526],[646,496],[706,477],[780,420],[832,374],[916,346],[1016,286]];
const roadB=[[787,419],[817,483],[846,550],[895,619],[887,687]];

const riverB=[[898,217],[850,241],[816,259],[770,288],[721,316],[690,353],[654,387],[641,433],[668,488]];
const riverC=[[1073,405],[1032,414],[991,417],[953,447],[916,475],[878,488],[842,478],[802,457],[788,423]];
function hash(i,j,k=0){let n=Math.imul(i+19,374761393)+Math.imul(j+31,668265263)+Math.imul(k+7,1274126177);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967295;}
function smooth(t){return t*t*(3-2*t)}
function noise(x,y,seed=0){const ix=Math.floor(x),iy=Math.floor(y),tx=smooth(x-ix),ty=smooth(y-iy),a=hash(ix,iy,seed),b=hash(ix+1,iy,seed),c=hash(ix,iy+1,seed),d=hash(ix+1,iy+1,seed);return (a+(b-a)*tx)+(c+(d-c)*tx-(a+(b-a)*tx))*ty}
function fbm(x,y,seed=0){let s=0,w=.56;for(let i=0;i<4;i++){s+=(noise(x,y,seed+i*11)-.5)*w;x*=2.03;y*=2.03;w*=.47}return s}

function gaussian(x,y,cx,cy,sx,sy){let dx=(x-cx)/sx,dy=(y-cy)/sy;return Math.exp(-.5*(dx*dx+dy*dy))}

const realPal={water:[81,137,155],beach:[207,201,164],plains:[191,193,146],forest:[96,143,108],wet:[127,165,139],hill:[174,180,136],mountain:[175,169,143],snow:[231,231,220]};
const inkPal={water:[167,195,185],beach:[230,206,163],plains:[229,212,171],forest:[205,190,148],wet:[217,201,163],hill:[219,199,157],mountain:[215,191,147],snow:[233,219,186]};
let realBase,inkBase;
function makeRaster(style){const out=document.createElement('canvas');out.width=GW;out.height=GH;const c=out.getContext('2d',{alpha:false}),im=c.createImageData(GW,GH),data=im.data;const pal=style==='realistic'?realPal:inkPal;for(let y=0;y<GH;y++){for(let x=0;x<GW;x++){let i=y*GW+x,px=x*GRID,py=y*GRID,hi=elevation[i],bi=biome[i],rr=0,cc;
 if(hi<=0){let depth=clamp(-hi,0,.3)/.3;cc=style==='realistic'?blend([122,173,179],[50,117,141],depth):blend([188,208,192],pal.water,depth*.5)}

 if(hi<=0){let n=hash(x,y,8)-.5;rr=n*(style==='realistic'?8:7)}

 }}c.putImageData(im,0,0);return out;}
function path(c,points){c.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length-1;i++){const [x,y]=points[i],[nx,ny]=points[i+1];c.quadraticCurveTo(x,y,(x+nx)/2,(y+ny)/2)}let q=points.at(-1);c.lineTo(q[0],q[1]);}
function drawStroke(c,pts,color,width,dash=[]){c.beginPath();path(c,pts);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.setLineDash(dash);c.stroke();c.setLineDash([])}
function textureContours(c,style){const spacing=4,levels=style==='realistic'?[.08,.16,.24,.33,.42,.51,.60,.69,.78]:[.11,.22,.33,.44,.55,.66,.77];c.save();for(let level of levels){c.beginPath();for(let y=spacing;y<H-spacing;y+=spacing){for(let x=spacing;x<W-spacing;x+=spacing){let p=getElev(x,y),right=getElev(x+spacing,y),down=getElev(x,y+spacing);if((p-level)*(right-level)<0){let t=(level-p)/(right-p);c.moveTo(x+t*spacing,y-1.3);c.lineTo(x+t*spacing,y+2.9)}if((p-level)*(down-level)<0){let t=(level-p)/(down-p);c.moveTo(x-1.3,y+t*spacing);c.lineTo(x+2.9,y+t*spacing)}}}c.strokeStyle=style==='realistic'?'#374f4160':'#775a3a9b';c.lineWidth=style==='realistic'?.55:.8;c.stroke()}c.restore()}
function coastline(c,style){const st=style==='realistic'?'#3e817b80':'#654f38c9';const segments=[];for(let y=0;y<H;y+=3){let x=6;while(x<W-6&&getElev(x,y)<=0)x+=2;if(x>=W-6)continue;segments.push([x,y])}drawStroke(c,segments,st,style==='realistic'?3:1.8);if(style==='illustrated'){drawStroke(c,segments,'#b6a47e',6);drawStroke(c,segments,st,1.4);for(let y=30;y<H-40;y+=20){let x=coast(y)-7-((y*17)%9);c.beginPath();c.arc(x,y,5,Math.PI*.15,Math.PI*.85);c.strokeStyle='#7b8065a8';c.lineWidth=.85;c.stroke()}}}
function drawLakes(c,style){c.save();c.beginPath();c.ellipse(624,254,75,39,-.22,0,Math.PI*2);c.fillStyle=style==='realistic'?'#7fb8c5':'#aec7b6';c.fill();c.lineWidth=style==='realistic'?2.6:2;c.strokeStyle=style==='realistic'?'#397c878a':'#6e6f56bb';c.stroke();if(style==='illustrated'){for(let j=0;j<11;j++){let x=581+j*8,y=260+Math.sin(j)*3;c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+3,y-2,x+6,y);c.strokeStyle='#6a8e8ba1';c.lineWidth=.8;c.stroke()}}c.restore()}
function rivers(c,style){for(const [pts,main] of [[riverA,true],[riverB,false],[riverC,false]]){if(style==='realistic'){drawStroke(c,pts,'#3e7887ac',main?17:10);drawStroke(c,pts,'#a0cbd2',main?11:6);drawStroke(c,pts,'#c6e1df6c',main?3:2)}else{drawStroke(c,pts,'#8eaa9a',main?14:8);drawStroke(c,pts,'#567f83',main?2.7:1.9);drawStroke(c,pts,'#d6dec950',main?1.1:.7)}}}
function drawRoads(c,style){if(layers.roads){for(let pts of [roadA,roadB]){if(style==='realistic'){drawStroke(c,pts,'#8c8060b8',10);drawStroke(c,pts,'#f0e5c7',6.2);drawStroke(c,pts,'#e8d9b1dd',1.2,[3,8])}else{drawStroke(c,pts,'#ba9a68',6);drawStroke(c,pts,'#674d2e',2.5);drawStroke(c,pts,'#dfc99b',1,[4,6])}}}if(layers.rail){drawStroke(c,railway,style==='realistic'?'#444e4b':'#604d3d',5);drawStroke(c,railway,style==='realistic'?'#d2d6d1':'#efdaaf',2.5);drawStroke(c,railway,style==='realistic'?'#535552':'#583e30',1,[1.6,10])}}
function forest(c,style){c.save();for(let y=35;y<H-40;y+=18){for(let x=260;x<W-30;x+=18){let jx=x+(hash(x,y,3)-.5)*10,jy=y+(hash(x,y,5)-.5)*10,bi=getBiome(jx,jy),h=getElev(jx,jy);if(bi!==2||h<=0||hash(x,y,18)<.12)continue;if(style==='realistic'){c.fillStyle=hash(x,y,1)>.5?'#335e3d40':'#254c3a32';c.beginPath();c.arc(jx,jy,1.4+hash(x,y,4)*3,0,Math.PI*2);c.fill()}else{const u=.7+hash(x,y,5)*.45;c.save();c.translate(jx,jy);c.scale(u,u);c.strokeStyle='#6b6e4289';c.lineWidth=1.25;c.beginPath();c.moveTo(0,-8);c.lineTo(-6,0);c.lineTo(6,0);c.closePath();c.moveTo(0,-4);c.lineTo(-7,5);c.lineTo(7,5);c.closePath();c.moveTo(0,3);c.lineTo(0,10);c.stroke();c.restore()}}}c.restore()}
function mountainInk(c){c.save();for(let y=45;y<H-40;y+=54){for(let x=420;x<W-25;x+=60){let px=x+(hash(x,y,11)-.5)*22,py=y+(hash(x,y,17)-.5)*22,v=getElev(px,py);if(v<.49||Math.abs(px-(1025-(py-270)*.39))>250||hash(x,y,10)>.58)continue;let f=clamp((v-.42)*1.8,.55,1.33);c.save();c.translate(px,py);c.scale(f,f);c.strokeStyle='#6e513ba6';c.lineWidth=1.1;c.beginPath();c.moveTo(-16,9);c.lineTo(-2,-17);c.lineTo(5,-9);c.lineTo(13,-20);c.lineTo(23,10);c.moveTo(-4,-15);c.lineTo(1,-4);c.lineTo(5,-9);c.moveTo(13,-19);c.lineTo(15,-3);c.stroke();c.strokeStyle='#8c684a7d';for(let i=0;i<4;i++){c.beginPath();c.moveTo(4+i*4,0+i*2);c.lineTo(7+i*4,3+i*2);c.stroke()}c.restore()}}c.restore()}
function seaHatch(c){c.save();c.strokeStyle='#638a8199';c.lineWidth=1;for(let y=30;y<H;y+=27){for(let x=25;x<250;x+=43){let px=x+(hash(x,y,2)-.5)*12,py=y+(hash(x,y,4)-.5)*9;if(getElev(px,py)>-.02||hash(x,y,5)<.22)continue;c.beginPath();c.moveTo(px-7,py);c.quadraticCurveTo(px-2,py-3,px+4,py);c.quadraticCurveTo(px+7,py+2,px+10,py);c.stroke();if(hash(x,y,8)>.65){c.beginPath();c.moveTo(px-2,py+5);c.lineTo(px+6,py+5);c.stroke()}}}c.restore()}
function paperGrain(c){c.save();for(let i=0;i<12500;i++){let x=hash(i,77)*W,y=hash(i,19)*H;c.fillStyle=i%3?'#5a402006':'#fff2b515';c.fillRect(x,y,1.5,1.5)}c.restore()}
function addLabels(c,style){c.save();const old=style==='illustrated';const labels=[{s:'北镜海',x:75,y:395,z:29,rotation:-.07,color:old?'#5f806d':'#e0f6ef'},{s:'苍岚山脉',x:990,y:163,z:21,rotation:-.25,color:old?'#66503b':'#eaf0e5'},{s:'白 河 谷 地',x:573,y:634,z:19,rotation:-.16,color:old?'#80684c':'#eef3d3'},{s:'雾松林',x:924,y:750,z:20,rotation:.10,color:old?'#5d6441':'#e6efdd'}];for(let t of labels){c.save();c.translate(t.x,t.y);c.rotate(t.rotation);c.textAlign='center';c.font=(old?'bold ':'600 ')+t.z+'px '+(old?'Georgia,"SimSun",serif':'"Microsoft YaHei",sans-serif');c.fillStyle=t.color;c.globalAlpha=old?.76:.69;if(!old){c.shadowColor='#3045339a';c.shadowBlur=9;c.shadowOffsetY=1}c.fillText(t.s,0,0);c.restore()}c.restore()}
function makeLayer(style){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{alpha:false});g.imageSmoothingEnabled=true;g.drawImage(style==='realistic'?realBase:inkBase,0,0,W,H);if(style==='illustrated')paperGrain(g);if(layers.contours)textureContours(g,style);coastline(g,style);drawLakes(g,style);rivers(g,style);forest(g,style);if(style==='illustrated'){mountainInk(g);seaHatch(g)}drawRoads(g,style);addLabels(g,style);if(style==='illustrated'){g.strokeStyle='#b08e5b67';g.lineWidth=6;g.strokeRect(14,14,W-28,H-28);g.strokeStyle='#795b3f48';g.lineWidth=1;g.strokeRect(22,22,W-44,H-44)}return c}
const textures={};function rebuild(){textures.realistic=makeLayer('realistic');textures.illustrated=makeLayer('illustrated');scheduleDraw()}
function syncSize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);map.width=Math.round(w*dpr);map.height=Math.round(h*dpr);map.style.width=w+'px';map.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);scheduleDraw()}
function view(){return {left:w/2-cx*scale,top:h/2-cy*scale,ww:W*scale,hh:H*scale}}
function screenPos(x,y){const v=view();return [v.left+x*scale,v.top+y*scale]}
function worldPos(x,y){const v=view();return [(x-v.left)/scale,(y-v.top)/scale]}
function paint(g){g.save();g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#d4d6be';g.fillRect(0,0,w,h);const v=view();g.imageSmoothingEnabled=scale<1.25;function draw(which){g.drawImage(textures[which],v.left,v.top,v.ww,v.hh)}if(mode==='compare'){g.save();g.beginPath();g.rect(0,0,w*split,h);g.clip();draw('realistic');g.restore();g.save();g.beginPath();g.rect(w*split,0,w*(1-split),h);g.clip();draw('illustrated');g.restore()}else draw(mode);g.restore();}
function requestRender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;paint(ctx);drawMarkers();syncCompare()})}
function scheduleDraw(){requestRender()}
function drawMarkers(){const holder=$('#markerLayer');holder.innerHTML='';const points=[...(layers.structures?structures.map(p=>({...p,structure:true})):[]),...(layers.waypoints?waypoints:[])];for(const p of points){const [x,y]=screenPos(p.x,p.y);if(x< -110||x>w+110||y< -50||y>h+60)continue;const ancient=mode==='illustrated'||(mode==='compare'&&x>w*split);const box=document.createElement('div');box.className='marker'+(ancient?' ancient':'');box.style.left=x+'px';box.style.top=y+'px';const icon=document.createElement('span');icon.className='markIcon';icon.textContent=icons[p.type]||'✦';if(p.color)icon.style.borderColor=p.color;const label=document.createElement('span');label.className='markLabel';label.textContent=p.name;box.append(icon,label);holder.appendChild(box)}}
function syncCompare(){const is=mode==='compare';$('#splitLine').classList.toggle('hidden',!is);$('#compareLeft').classList.toggle('hidden',!is);$('#compareRight').classList.toggle('hidden',!is);$('#splitLine').style.left=(split*100)+'%';$('#splitLine').setAttribute('aria-valuenow',Math.round(split*100));}
function setMode(v){if(!['realistic','illustrated','compare'].includes(v))return;mode=v;all('[data-mode]').forEach(b=>b.classList.toggle('selected',b.dataset.mode===v));scheduleDraw();toast(v==='realistic'?'已切换写实地形图 · 不重新测绘':v==='illustrated'?'已切换古式手绘 · 使用同一份地表数据':'已进入左右对照 · 拖动中线检查地形一致性');}
function toast(message){const el=$('#toast');el.textContent=message;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),2500)}
const panelEl=$('#panel'),backdrop=$('#modalBackdrop'),modalEl=$('#modal');
function title(t,k,desc){return `<button class="smallClose" data-act="panel-close" aria-label="关闭">×</button><div class="panelLabel">${k}</div><h3 class="panelTitle">${t}</h3><p class="panelSubtitle">${desc}</p>`}
function panelOpen(p){if(panel===p){panelClose();return}panel=p;backdrop.classList.add('hidden');let html='';if(p==='atlas'){html=title('地图册 · 测绘资源','ATLAS / INVENTORY','展示地图册的资源槽。此页为视觉演示，不消耗物品。')+[['已购买地图页','24 / 24'],['墨水','84 / 100'],['颜料（红黄蓝）','已启用彩色'],['发光墨水','17 / 40'],['指南针','已装入']].map(([a,b])=>`<div class="resource"><small>${a}</small><strong>${b}</strong></div>`).join('')+`<div class="panelGroup"><button class="btn" data-act="settings">地图风格与设置</button></div>`}else if(p==='layers'){html=title('地图图层','MAP LAYERS','仅控制显示。切换不会重新读取或扣除地图资源。')+Object.entries({roads:['地表道路','自然路径、人工道路'],rail:['铁路','原版 + 机械动力兼容图层'],structures:['已确认地表结构','实际生成的村庄、港口、遗迹'],waypoints:['玩家标点','自定义名字、图标、颜色'],contours:['等高线','地形起伏层级']}).map(([k,[n,d]])=>`<label class="layerRow"><div><span>${n}</span><small>${d}</small></div><input type="checkbox" data-layer="${k}" ${layers[k]?'checked':''}/></label>`).join('')}else if(p==='markers'){html=title('我的标点','WAYPOINTS','点击地图标点即可居中。右键地图可添加自定义标点。')+`<div class="markList">${waypoints.map((p,i)=>`<button data-go="${i}"><span style="font-size:24px">${icons[p.type]}</span><div><b>${escapeHtml(p.name)}</b><small>X ${Math.round(p.x*3)} · Z ${Math.round(p.y*3)}</small></div></button>`).join('')}</div>`}else if(p==='info'){html=title('关于这次预览','CARTOGRAPH / DESIGN REVIEW','该文件是完全离线的 HTML 高保真设计稿。')+`<div class="resource"><small>写实 / 手绘</small><strong>同源地貌</strong></div><div class="resource"><small>渲染策略</small><strong>预生成贴图 / 平移仅变换</strong></div><div class="resource"><small>地图扫描</small><strong>不连接实际 Minecraft 世界</strong></div><div class="panelGroup"><button class="btn" data-act="settings">打开风格设置</button></div>`}panelEl.innerHTML=html;panelEl.classList.remove('hidden');}
function panelClose(){panel='';panelEl.classList.add('hidden')}
function mini(which){return `<div class="miniPreview"><canvas id="mini-${which}"></canvas><span class="chip">${which==='realistic'?'自然地貌':'古式地图'}</span></div>`}
function settingsOpen(){panelClose();modal='settings';modalEl.innerHTML=`<div class="modalHeading"><div><div class="panelLabel">CARTOGRAPH / MAP STYLE</div><h2>地图设置</h2><p>风格只改变画法。地表、水系、道路、标点仍是同一份真实数据。</p></div><button data-act="modal-close" aria-label="关闭设置">×</button></div><div class="settingCaption">地图风格 · MAP APPEARANCE</div><div class="styleCards"><button class="styleCard ${mode==='realistic'?'chosen':''}" data-style="realistic">${mini('realistic')}<strong>写实地形图</strong><small>自然地表色彩、山体阴影、森林植被、水系和路网，类似现代地形地图</small></button><button class="styleCard ${mode==='illustrated'?'chosen':''}" data-style="illustrated">${mini('illustrated')}<strong>古式手绘地图</strong><small>泛黄纸张、墨线海岸、等高线、山峦和森林符号，保持真实地貌</small></button></div><div class="settingCaption">图层绘制 · MAP CONTENT</div><label class="settingsToggle"><b>显示地形等高线</b><input type="checkbox" data-layer="contours" ${layers.contours?'checked':''}></label><label class="settingsToggle"><b>显示道路与铁路</b><input type="checkbox" data-both="routes" ${layers.roads&&layers.rail?'checked':''}></label><div class="modalFooter"><small>当前为演示地形；正式模组中切换风格不重新测绘、不消耗墨水或颜料。</small><button class="btn primary" data-act="modal-close">完成</button></div>`;backdrop.classList.remove('hidden');for(let m of ['realistic','illustrated']){const target=$('#mini-'+m),g=target.getContext('2d');target.width=380;target.height=180;g.imageSmoothingEnabled=true;g.drawImage(textures[m],370,200,570,270,0,0,380,180)}}
function modalClose(){modal='';backdrop.classList.add('hidden')}
function waypointModal(x,y){panelClose();modal='marker';modalEl.innerHTML=`<div class="modalHeading"><div><div class="panelLabel">NEW / WAYPOINT</div><h2>新增地图标点</h2><p>位置 X ${Math.round(x*3)} · Z ${Math.round(y*3)} · 当前演示地形</p></div><button data-act="modal-close">×</button></div><div class="settingCaption">标点名称</div><input class="settingInput" id="markerName" maxlength="18" value="自定义标点"/><div class="settingCaption">图标</div><div class="styleCards"><button class="btn" data-marker-icon="star">✦ 地标</button><button class="btn" data-marker-icon="home">⌂ 住处</button><button class="btn" data-marker-icon="camp">⚑ 营地</button><button class="btn" data-marker-icon="mine">◆ 矿区</button></div><div class="settingCaption">标点颜色</div><input id="markerColor" type="color" value="#bc7a55" style="width:78px;height:36px;background:transparent;border:0"/><div class="modalFooter"><small>标点图标、颜色和名字均可配置。</small><button class="btn primary" data-act="save-marker">保存标点</button></div>`;backdrop.classList.remove('hidden');modalEl.dataset.x=x;modalEl.dataset.y=y;modalEl.dataset.type='star';}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function initEvents(){all('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){const a=b.dataset.act;if(a==='settings')settingsOpen();else if(a==='panel-close')panelClose();else if(a==='modal-close')modalClose();else if(a==='center'){cx=630;cy=465;scale=Math.max(w/W,h/H)*1.08;scheduleDraw();toast('已回到玩家附近')}else if(a==='exit')toast('这是独立 HTML 原型；正式模组内返回游戏');else if(['atlas','markers','layers','info'].includes(a))panelOpen(a);else if(a==='save-marker'){const n=$('#markerName').value.trim()||'未命名标点';waypoints.push({name:n,type:modalEl.dataset.type,color:$('#markerColor').value,x:+modalEl.dataset.x,y:+modalEl.dataset.y});modalClose();scheduleDraw();toast('标点已保存到原型演示数据')}}const s=e.target.closest('[data-style]');if(s){setMode(s.dataset.style);settingsOpen()}const i=e.target.closest('[data-marker-icon]');if(i){modalEl.dataset.type=i.dataset.markerIcon;all('[data-marker-icon]').forEach(x=>x.style.background=x===i?'#7a6a49':'')};const go=e.target.closest('[data-go]');if(go){const m=waypoints[Number(go.dataset.go)];if(m){cx=m.x;cy=m.y;scheduleDraw();panelClose();toast('已定位到 '+m.name)}}});document.addEventListener('change',e=>{const inp=e.target.closest('[data-layer]');if(inp){layers[inp.dataset.layer]=inp.checked;rebuild();toast('图层已更新，无需重新扫描地图')}if(e.target.matches('[data-both="routes"]')){layers.roads=e.target.checked;layers.rail=e.target.checked;rebuild();toast('路网图层已更新')}});backdrop.addEventListener('click',e=>{if(e.target===backdrop)modalClose()});area.addEventListener('contextmenu',e=>{e.preventDefault();if(drag){drag=null;return}const [x,y]=worldPos(e.clientX,e.clientY),menu=$('#contextMenu');menu.style.left=clamp(e.clientX,8,w-184)+'px';menu.style.top=clamp(e.clientY,8,h-96)+'px';menu.innerHTML=`<button data-cmd="add">＋ 在此添加标点</button><button data-cmd="recenter">⌖ 以此位置居中</button>`;menu.classList.remove('hidden');menu.dataset.x=x;menu.dataset.y=y});$('#contextMenu').addEventListener('click',e=>{let b=e.target.closest('[data-cmd]');if(!b)return;let m=$('#contextMenu'),x=+m.dataset.x,y=+m.dataset.y;m.classList.add('hidden');if(b.dataset.cmd==='add')waypointModal(x,y);else{cx=x;cy=y;scheduleDraw()}});area.addEventListener('pointerdown',e=>{if(e.button!==0)return;if(mode==='compare'&&Math.abs(e.clientX-w*split)<28){splitDrag=true;area.setPointerCapture(e.pointerId);return}drag={x:e.clientX,y:e.clientY,cx,cy};area.classList.add('dragging');area.setPointerCapture(e.pointerId);$('#contextMenu').classList.add('hidden')});area.addEventListener('pointermove',e=>{if(splitDrag){split=clamp(e.clientX/w,.08,.92);requestRender();return}if(drag){cx=drag.cx-(e.clientX-drag.x)/scale;cy=drag.cy-(e.clientY-drag.y)/scale;requestRender()}const [x,y]=worldPos(e.clientX,e.clientY);$('#coords').textContent=`X ${Math.round(x*3)} · Z ${Math.round(y*3)} ｜ 滚轮缩放 / 拖动平移`});area.addEventListener('pointerup',()=>{drag=null;splitDrag=false;area.classList.remove('dragging')});area.addEventListener('pointercancel',()=>{drag=null;splitDrag=false;area.classList.remove('dragging')});area.addEventListener('wheel',e=>{e.preventDefault();let [ax,ay]=worldPos(e.clientX,e.clientY);scale=clamp(scale*Math.exp(-e.deltaY*.0012),.40,4.3);cx=ax-(e.clientX-w/2)/scale;cy=ay-(e.clientY-h/2)/scale;requestRender()},{passive:false});$('#splitLine').addEventListener('pointerdown',e=>{e.stopPropagation();splitDrag=true;$('#splitLine').setPointerCapture(e.pointerId)});$('#splitLine').addEventListener('pointermove',e=>{if(splitDrag){split=clamp(e.clientX/w,.08,.92);requestRender()}});$('#splitLine').addEventListener('pointerup',()=>splitDrag=false);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.key==='Escape'){modalClose();panelClose();$('#contextMenu').classList.add('hidden')}if(e.key==='1')setMode('realistic');if(e.key==='2')setMode('illustrated');if(e.key==='3')setMode('compare')});window.addEventListener('resize',syncSize)}
function start(){collectGeometry();realBase=makeRaster('realistic');inkBase=makeRaster('illustrated');scale=Math.max(innerWidth/W,innerHeight/H)*1.08;cx=630;cy=465;rebuild();initEvents();syncSize();setMode('compare');}
start();
})();
