plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = providers.gradleProperty('mod_version')
        .getOrElse(file('../VERSION').text.trim())
group = mod_group_id
base { archivesName = 'Cartograph-V3.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: project.version
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.java.srcDir "../common-$minecraft_version/src/main/java"
sourceSets.main.resources.srcDir '../common/src/main/resources'
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) {
    archiveFileName = "Cartograph-V3.1-${project.version}-mc${minecraft_version}-neoforge.jar"
}

apply from: '../verify.gradle'
