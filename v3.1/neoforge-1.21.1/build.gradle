plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id
base { archivesName = 'Cartograph-V3.1' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar) {
    archiveFileName = "Cartograph-V3.1-${mod_version}-mc${minecraft_version}-neoforge.jar"
}

tasks.register('verifyV3Isolation') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def legacy = zipTree(jarFile).matching { include 'com/wanstu/cartograph/**' }.files
        if (!legacy.isEmpty()) {
            throw new GradleException("V3 JAR contains legacy runtime classes: " + legacy)
        }
        def sourceLeak = fileTree('src/main/java').matching {
            include '**/*.java'
        }.files.findAll { it.text.contains('import com.wanstu.cartograph.') }
        if (!sourceLeak.isEmpty()) {
            throw new GradleException("V3 source imports legacy runtime: " + sourceLeak)
        }
    }
}

tasks.register('verifyV31WebUiBoundary') {
    dependsOn tasks.named('jar')
    doLast {
        def javaSources = fileTree('src/main/java').matching {
            include '**/*.java'
        }.files
        def forbiddenSourceTokens = [
            'net.ethrocky.pane',
            'class MapScreenV3',
            'class MapScreenV31',
            'MapPaneRenderer',
            'NativeMapCanvas',
            'NativeCartographThemeFrontend'
        ]
        forbiddenSourceTokens.each { token ->
            def offenders = javaSources.findAll { it.text.contains(token) }
            if (!offenders.isEmpty()) {
                throw new GradleException(
                    'V3.1 must not contain in-game UI/Panes (' + token + '): ' + offenders)
            }
        }

        def client = file(
            'src/main/java/com/wanstu/cartographv3/CartographV3Client.java').text
        if (client.contains('CartographWebUiServer')
                || client.contains('openInBrowser(')) {
            throw new GradleException(
                'M shortcut must not be coupled directly to the WebUI implementation')
        }
        if (!client.contains('openConfiguredFrontend()')) {
            throw new GradleException(
                'M shortcut must route through the backend-controlled frontend router')
        }

        def webBridge = file(
            'src/main/java/com/wanstu/cartographv3/CartographWebUiServer.java').text
        if (webBridge.contains('new MinecraftCartographBackend(')) {
            throw new GradleException(
                'WebUI transport must use the shared injected backend, not create its own')
        }

        def store = file(
            'src/main/java/com/wanstu/cartographv3/PersistentTileStore.java').text
        if (store.contains('SatelliteSurfaceRenderer')
                || store.contains('.rgb()')
                || store.contains('renderSignature')) {
            throw new GradleException(
                'V3.1 persistent cache must store facts only, never rendered pixels')
        }

        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def index = zipTree(jarFile).matching { include 'webui/index.html' }.files
        def script = zipTree(jarFile).matching { include 'webui/app.js' }.files
        if (index.size() != 1 || script.size() != 1) {
            throw new GradleException(
                'V3.1 JAR must contain webui/index.html and webui/app.js')
        }

        def paneEntries = zipTree(jarFile).matching {
            include '**/*pane*'
            include 'net/ethrocky/pane/**'
            include 'META-INF/jarjar/**'
        }.files
        if (!paneEntries.isEmpty()) {
            throw new GradleException(
                'V3.1 WebUI JAR still contains Pane/Jar-in-Jar UI artifacts: ' + paneEntries)
        }

        def screenClasses = zipTree(jarFile).matching {
            include 'com/wanstu/cartographv3/MapScreen*.class'
            include 'com/wanstu/cartographv3/MapPane*.class'
            include 'com/wanstu/cartographv3/MapHifi*.class'
            include 'com/wanstu/cartographv3/NativeMapCanvas*.class'
            include 'com/wanstu/cartographv3/NativeCartographThemeFrontend*.class'
        }.files
        if (!screenClasses.isEmpty()) {
            throw new GradleException(
                'V3.1 JAR contains removed in-game UI classes: ' + screenClasses)
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyV3Isolation')
    dependsOn tasks.named('verifyV31WebUiBoundary')
}
