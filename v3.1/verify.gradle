def commonMain = file('../common/src/main')
def commonJava = file("$commonMain/java/com/wanstu/cartographv3")
def distributionJar = tasks.named(tasks.names.contains('remapJar') ? 'remapJar' : 'jar')

tasks.register('verifyV3Isolation') {
    dependsOn distributionJar
    doLast {
        def jarFile = distributionJar.get().archiveFile.get().asFile
        def legacy = zipTree(jarFile).matching { include 'com/wanstu/cartograph/**' }.files
        if (!legacy.isEmpty()) {
            throw new GradleException("V3 JAR contains legacy runtime classes: " + legacy)
        }
        def sourceLeak = sourceSets.main.allJava.files.findAll { it.text.contains('import com.wanstu.cartograph.') }
        if (!sourceLeak.isEmpty()) {
            throw new GradleException("V3 source imports legacy runtime: " + sourceLeak)
        }
        def sharedSources = fileTree(commonJava).matching { include '**/*.java' }.files
        def loaderImports = sharedSources.findAll { file ->
            ['net.neoforged.', 'net.fabricmc.'].any { file.text.contains(it) }
        }
        if (!loaderImports.isEmpty()) {
            throw new GradleException("Shared Minecraft code imports a loader API: " + loaderImports)
        }
    }
}

tasks.register('verifyV31WebUiBoundary') {
    dependsOn distributionJar
    doLast {
        def javaSources = sourceSets.main.allJava.files
        def forbiddenSourceTokens = [
            'net.ethrocky.pane',
            'class MapScreenV3',
            'class MapScreenV31',
            'MapPaneRenderer',
            'NativeMapCanvas',
            'NativeCartographThemeFrontend'
        ]
        forbiddenSourceTokens.each { token ->
            def offenders = javaSources.findAll { it.text.contains(token) }
            if (!offenders.isEmpty()) {
                throw new GradleException(
                    'V3.1 must not contain the removed Pane or legacy renderer (' + token + '): ' + offenders)
            }
        }

        def client = file(
            "$commonJava/CartographClient.java").text
        if (client.contains('CartographWebUiServer')
                || client.contains('openInBrowser(')) {
            throw new GradleException(
                'M shortcut must not be coupled directly to the WebUI implementation')
        }
        if (!client.contains('openConfiguredFrontend()')) {
            throw new GradleException(
                'M shortcut must route through the backend-controlled frontend router')
        }

        def webBridge = file(
            "$commonJava/CartographWebUiServer.java").text
        if (webBridge.contains('new MinecraftCartographBackend(')) {
            throw new GradleException(
                'WebUI transport must use the shared injected backend, not create its own')
        }

        def store = file(
            "$commonJava/PersistentTileStore.java").text
        if (store.contains('SatelliteSurfaceRenderer')
                || store.contains('.rgb()')
                || store.contains('renderSignature')) {
            throw new GradleException(
                'V3.1 persistent cache must store facts only, never rendered pixels')
        }

        def jarFile = distributionJar.get().archiveFile.get().asFile
        def index = zipTree(jarFile).matching { include 'webui/index.html' }.files
        def script = zipTree(jarFile).matching { include 'webui/app.js' }.files
        if (index.size() != 1 || script.size() != 1) {
            throw new GradleException(
                'V3.1 JAR must contain webui/index.html and webui/app.js')
        }
        def nativeEntries = zipTree(jarFile).matching {
            include 'com/wanstu/cartographv3/InGameMapScreen.class'
            include 'com/wanstu/cartographv3/InGameCartographFrontend.class'
            include 'assets/cartograph_v3/textures/gui/map-icons.png'
        }.files
        if (nativeEntries.size() != 3) {
            throw new GradleException('V3.1 JAR must ship the native screen, frontend, and icon atlas')
        }
        def nativeBindings = javaSources.findAll { it.name.startsWith('InGame') }
        if (nativeBindings.any { source ->
            ['MapClientCache', 'MapTransport', 'PacketDistributor', 'CartographWebUiServer',
             'new MinecraftCartographBackend('].any { token -> source.text.contains(token) }
        }) {
            throw new GradleException('Native frontend must consume the shared backend API')
        }

        def paneEntries = zipTree(jarFile).matching {
            include '**/*pane*'
            include 'net/ethrocky/pane/**'
            include 'META-INF/jarjar/**'
        }.files
        if (!paneEntries.isEmpty()) {
            throw new GradleException(
                'V3.1 WebUI JAR still contains Pane/Jar-in-Jar UI artifacts: ' + paneEntries)
        }

        def screenClasses = zipTree(jarFile).matching {
            include 'com/wanstu/cartographv3/MapScreen*.class'
            include 'com/wanstu/cartographv3/MapPane*.class'
            include 'com/wanstu/cartographv3/MapHifi*.class'
            include 'com/wanstu/cartographv3/NativeMapCanvas*.class'
            include 'com/wanstu/cartographv3/NativeCartographThemeFrontend*.class'
        }.files
        if (!screenClasses.isEmpty()) {
            throw new GradleException(
                'V3.1 JAR contains removed in-game UI classes: ' + screenClasses)
        }
    }
}

tasks.register('verifyV31WebSocketTransport') {
    doLast {
        def app = file("$commonMain/resources/webui/app.js").text
        def server = file(
            "$commonJava/CartographWebUiServer.java").text
        def cache = file(
            "$commonJava/MapClientCache.java").text

        ['fetch(', 'XMLHttpRequest', 'EventSource',
         '/api/v1/state', '/api/v1/tiles', '/api/v1/session',
         '/api/v1/viewport', '/api/v1/point', '/api/v1/teleport',
         '/api/v1/markers', '/api/v1/runtime-settings'].each { token ->
            if (app.contains(token)) {
                throw new GradleException(
                    'WebUI runtime must use one WebSocket, found legacy transport: ' + token)
            }
        }
        ['text/event-stream', '/api/v1/state', '/api/v1/tiles',
         '/api/v1/session', '/api/v1/viewport', '/api/v1/point',
         '/api/v1/teleport', '/api/v1/markers', '/api/v1/runtime-settings'].each { token ->
            if (server.contains(token)) {
                throw new GradleException(
                    'Legacy runtime HTTP endpoint remains in the WebUI server: ' + token)
            }
        }
        ['Sec-WebSocket-Accept', 'WebSocketSession', 'sendBinary',
         'readWebSocketFrame'].each { token ->
            if (!server.contains(token)) {
                throw new GradleException(
                    'WebSocket server implementation is incomplete: ' + token)
            }
        }
        if (!app.contains('new WebSocket(')
                || !app.contains('binaryType=\'arraybuffer\'')) {
            throw new GradleException(
                'WebUI must use one binary-capable WebSocket connection')
        }
        if (!cache.contains('addTileChangeListener')
                || !server.contains('MapClientCache.addTileChangeListener')) {
            throw new GradleException(
                'Map tile updates must be pushed from backend cache-change events')
        }
    }
}

tasks.register('verifyV31FrontendThemes') {
    doLast {
        def app = file("$commonMain/resources/webui/app.js").text
        def page = file("$commonMain/resources/webui/index.html").text
        def settings = file("$commonMain/java/com/wanstu/cartographv3/CartographSettings.java").text
        def mode = file("$commonMain/java/com/wanstu/cartographv3/MapDrawingMode.java").text
        def registry = file("$commonMain/java/com/wanstu/cartographv3/MapVisualStyleRegistry.java").text
        def processor = file("$commonMain/java/com/wanstu/cartographv3/MapVisualStyleProcessor.java").text
        def processors = file("$commonMain/java/com/wanstu/cartographv3/MapVisualStyleProcessors.java").text
        def satelliteData = file("$commonMain/java/com/wanstu/cartographv3/SatelliteMapData.java").text
        def handData = file("$commonMain/java/com/wanstu/cartographv3/HandDrawnMapData.java").text
        def renderer = file("$commonMain/java/com/wanstu/cartographv3/MapPresentationRenderer.java").text
        def server = file("$commonMain/java/com/wanstu/cartographv3/CartographWebUiServer.java").text
        def dialogs = file("$commonMain/java/com/wanstu/cartographv3/InGameMapDialogs.java").text
        def nativeUi = file("$commonMain/java/com/wanstu/cartographv3/InGameMapUi.java").text
        def nativeTiles = file("$commonMain/java/com/wanstu/cartographv3/InGameMapTiles.java").text
        def renderedAtlasStore = file("$commonMain/java/com/wanstu/cartographv3/PersistentRenderedAtlasStore.java").text

        ['SATELLITE("satellite", "卫星")',
         'HAND_DRAWN("hand_drawn", "手绘")',
         'return this == SATELLITE ? HAND_DRAWN : SATELLITE;'].each { token ->
            if (!mode.contains(token)) {
                throw new GradleException('DrawingMode contract is incomplete: ' + token)
            }
        }
        ['MODERN', 'ANCIENT', 'ANIME'].each { forbidden ->
            if (mode.contains(forbidden)) {
                throw new GradleException('DrawingMode must stay closed to satellite/hand-drawn: ' + forbidden)
            }
        }

        ['"modern", "现代"', '"ancient", "古式"', '"anime", "动漫"',
         'MapVisualStyleProcessors.MODERN', 'MapVisualStyleProcessors.ANCIENT',
         'MapVisualStyleProcessors.ANIME', 'private static void register(Style style)'].each { token ->
            if (!registry.contains(token)) {
                throw new GradleException('VisualStyle registry is incomplete: ' + token)
            }
        }
        ['int[] renderSatellite(SatelliteMapData data, int stride);',
         'int[] renderHandDrawn(HandDrawnMapData data, int stride);'].each { token ->
            if (!processor.contains(token)) {
                throw new GradleException('VisualStyle processor dual-entry contract is incomplete: ' + token)
            }
        }
        ['class Modern implements MapVisualStyleProcessor',
         'class Ancient implements MapVisualStyleProcessor',
         'class Anime implements MapVisualStyleProcessor',
         'renderSatellite(SatelliteMapData data, int stride)',
         'renderHandDrawn(HandDrawnMapData data, int stride)'].each { token ->
            if (!processors.contains(token)) {
                throw new GradleException('Built-in VisualStyle processor is incomplete: ' + token)
            }
        }

        ['record SatelliteMapData(SurfaceTile facts)',
         'SatelliteSurfaceRenderer.renderPixels(facts, stride)'].each { token ->
            if (!satelliteData.contains(token)) {
                throw new GradleException('SatelliteMapData contract is incomplete: ' + token)
            }
        }
        ['record HandDrawnMapData(', 'static final int CELL_SIZE = 4;',
         'private enum TerrainClass', 'TerrainClass.VEGETATION',
         'static final int WATER_THRESHOLD = 19;',
         'static final int FOREST_THRESHOLD = 31;',
         'classes[cell] = waterPct >= WATER_THRESHOLD',
         'depth[cell] = waterCount == 0',
         'depth = smoothWaterDepth(depth, water);',
         'forest = smoothForestPercent(forest, water);',
         'canopy = smoothCanopyHeight(canopy, forest);',
         'int waterDepthAtPixel(int localX, int localZ)',
         'int shorelineStrengthAtPixel(int localX, int localZ, int radius)',
         'int forestPercentAtPixel(int localX, int localZ)',
         'int canopyHeightAtPixel(int localX, int localZ)',
         'int forestEdgeStrengthAtPixel(int localX, int localZ, int radius)',
         'Arrays.sort(heights, 0, heightCount);',
         'relief[cell] = heights[heightCount / 2];',
         'classes = smoothClasses(classes, water);',
         'range = smoothRanges(range);', 'relief = reliefNeighborhood.smoothedCenterRelief();',
         'ReliefNeighborhood reliefNeighborhood = ReliefNeighborhood.from(',
         'slope = deriveSlopeStrength(reliefNeighborhood, water);',
         'shade = deriveHillshade(reliefNeighborhood, water);',
         'form = deriveLandform(reliefNeighborhood, water);',
         'private static final class ReliefNeighborhood',
         'private static ReliefGrid summarizeRelief(SurfaceTile tile)',
         'private static double blendedGradient(',
         'int slopeStrengthAtPixel(int localX, int localZ)',
         'int hillshadeAtPixel(int localX, int localZ)',
         'int landformAtPixel(int localX, int localZ)',
         'static HandDrawnMapData from(SurfaceTile tile)',
         'int[] abstractPixels(int stride)'].each { token ->
            if (!handData.contains(token)) {
                throw new GradleException('HandDrawnMapData contract is incomplete: ' + token)
            }
        }
        ['applyHandDrawnWaterDepth(color, depth, style)',
         'applyHandDrawnShoreline(color, shoreline, style)',
         'HandDrawnMapData.WATER_THRESHOLD',
         'private static int applyHandDrawnWaterDepth',
         'private static int applyHandDrawnShoreline',
         'applyHandDrawnForest(color, forestPercent, canopyHeight, style)',
         'applyHandDrawnForestEdge(color, forestEdge, style)',
         'private static int applyHandDrawnForest(',
         'private static int applyHandDrawnForestEdge(',
         'applyHandDrawnRelief(',
         'private static int applyHandDrawnRelief('].each { token ->
            if (!processors.contains(token)) {
                throw new GradleException('Hand-drawn semantic presentation is incomplete: ' + token)
            }
        }
        if (!renderer.contains('private static final long PIPELINE_VERSION = 7L;')) {
            throw new GradleException('Presentation pipeline version must invalidate chunk-local relief atlases')
        }
        ['switch (CartographSettings.drawingMode())',
         'case SATELLITE -> processor.renderSatellite(SatelliteMapData.from(tile), stride);',
         'HandDrawnMapData.from(tile, tileLookup)',
         'static long dependencyFingerprint(',
         'MapDrawingMode.HAND_DRAWN'].each { token ->
            if (!renderer.contains(token)) {
                throw new GradleException('Presentation renderer composition is incomplete: ' + token)
            }
        }

        ['MapPresentationRenderer.dependencyFingerprint(',
         'MapPresentationRenderer.renderPixels(tile, stride, backend::tile)',
         'backend.regionRevision(dimension, x + dx, z + dz)'].each { token ->
            if (!nativeTiles.contains(token)) {
                throw new GradleException('Native cross-chunk relief invalidation is incomplete: ' + token)
            }
        }
        ['MapPresentationRenderer.dependencyFingerprint(',
         'MapPresentationRenderer.render(facts, backend::tile)'].each { token ->
            if (!server.contains(token)) {
                throw new GradleException('Web cross-chunk relief invalidation is incomplete: ' + token)
            }
        }

        ['private static final int SCHEMA = 3;',
         'p.setProperty("drawingMode", drawingMode.id())',
         'p.setProperty("visualStyle", visualStyleId)'].each { token ->
            if (!settings.contains(token)) {
                throw new GradleException('Shared presentation settings are incomplete: ' + token)
            }
        }
        if (settings.contains('frontendTheme')) {
            throw new GradleException('Legacy frontendTheme persistence must be removed')
        }

        ['"drawingMode", CartographSettings.drawingMode().id()',
         '"visualStyle", CartographSettings.visualStyle().id()',
         'MapPresentationRenderer.renderSignature()',
         'MapPresentationRenderer.render(facts, backend::tile).rgb()'].each { token ->
            if (!server.contains(token)) {
                throw new GradleException('WebUI presentation bridge is incomplete: ' + token)
            }
        }
        ['action(ui, row, "绘图方式", mode.label()',
         'action(ui, row, "绘图风格", style.label()'].each { token ->
            if (!dialogs.contains(token)) {
                throw new GradleException('Native presentation selector is incomplete: ' + token)
            }
        }
        if (!nativeUi.contains('MapVisualStyleProcessor.Palette palette = MapPresentationRenderer.palette();')
                || !nativeTiles.contains('MapPresentationRenderer.renderPixels(tile, stride, backend::tile)')) {
            throw new GradleException('Native frontend is not consuming the split presentation model')
        }

        ['private record TextureKey(Region region, int stride, long signature) {}',
         'private long targetSignature;', 'frame = List.of();',
         'targetSignature = appearance;',
         'findDisplayAtlas(', 'targetSignature, keep',
         'PersistentRenderedAtlasStore.load(', 'PersistentRenderedAtlasStore.save(',
         'long fingerprint = MapPresentationRenderer.dependencyFingerprint(',
         'if (atlas.fingerprints[index] == fingerprint) continue;',
         'Never keep drawing the previous presentation',
         'Never cross signatures here'].each { token ->
            if (!nativeTiles.contains(token)) {
                throw new GradleException('Native rendered-atlas cache contract is incomplete: ' + token)
            }
        }
        ['private long displaySignature;', 'displaySignature != targetSignature'].each { forbidden ->
            if (nativeTiles.contains(forbidden)) {
                throw new GradleException('Cross-style display fallback must not return: ' + forbidden)
            }
        }
        if (nativeTiles.contains('appearance != signature) {')) {
            throw new GradleException('Legacy style-switch close path must not return')
        }
        ['final class PersistentRenderedAtlasStore',
         'record Snapshot(long[] fingerprints, int[] pixels)',
         'cartograph-v31-rendered-atlas-v1', 'static Optional<Snapshot> load(',
         'static void save(', 'StandardCopyOption.ATOMIC_MOVE'].each { token ->
            if (!renderedAtlasStore.contains(token)) {
                throw new GradleException('Persistent rendered-atlas store is incomplete: ' + token)
            }
        }

        ['satellite','hand_drawn'].each { id ->
            if (!page.contains('data-drawing-mode="' + id + '"')) {
                throw new GradleException('Missing drawing-mode card: ' + id)
            }
        }
        ['modern','ancient','anime'].each { id ->
            if (!page.contains('data-visual-style="' + id + '"')
                    || !page.contains('.app[data-theme="' + id + '"]')) {
                throw new GradleException('Missing VisualStyle UI/CSS: ' + id)
            }
        }
        ['DRAWING_MODES', 'VISUAL_STYLES', 'MAP_RENDERERS',
         'function applyPresentation()', 'selectDrawingMode(id)', 'selectVisualStyle(id)',
         'function renderMapTerrain(s)', 'function refreshPresentationTerrain()',
         'app.dataset.mapRenderer=mode.id'].each { token ->
            if (!app.contains(token)) {
                throw new GradleException('WebUI presentation runtime is incomplete: ' + token)
            }
        }
        ['frontendTheme', 'FRONTEND_THEMES', 'data-theme-choice'].each { legacy ->
            if (app.contains(legacy) || page.contains(legacy)) {
                throw new GradleException('Legacy combined-theme token remains: ' + legacy)
            }
        }

        def renderDispatch = app.indexOf('const renderer=MAP_RENDERERS[mode.id]||MAP_RENDERERS.satellite')
        if (renderDispatch < 0) {
            throw new GradleException('Terrain rendering must dispatch through DrawingMode')
        }

        def start = app.indexOf('function applyPresentation()')
        def end = app.indexOf('async function selectDrawingMode(', start)
        if (start < 0 || end <= start) {
            throw new GradleException('Cannot inspect presentation application boundary')
        }
        def presentationRuntime = app.substring(start, end)
        ['wsRequest(', 'connectSocket(', 'sendViewport', 'tileCache.clear', 'regionCache.clear'].each { forbidden ->
            if (presentationRuntime.contains(forbidden)) {
                throw new GradleException(
                    'Presentation application must not own backend/cache/transport work: ' + forbidden)
            }
        }
    }
}
tasks.named('check').configure {
    dependsOn tasks.named('verifyV3Isolation')
    dependsOn tasks.named('verifyV31WebUiBoundary')
    dependsOn tasks.named('verifyV31WebSocketTransport')
    dependsOn tasks.named('verifyV31FrontendThemes')
}

def performanceVerification = sourceSets.create('performanceVerification') {
    java.srcDir '../common/src/test/java'
    compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
}
tasks.register('verifyV31PerformanceBudget', JavaExec) {
    dependsOn tasks.named('performanceVerificationClasses')
    classpath = performanceVerification.runtimeClasspath
    mainClass = 'com.wanstu.cartographv3.PerformanceSelfTest'
    maxHeapSize = '384m'
}
tasks.named('check').configure {
    dependsOn tasks.named('verifyV31PerformanceBudget')
}
