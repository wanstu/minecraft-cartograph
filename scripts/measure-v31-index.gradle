allprojects {
    afterEvaluate {
        if (sourceSets.findByName('performanceVerification') != null) {
            tasks.register('measureV31RealWorldIndex', JavaExec) {
                dependsOn tasks.named('performanceVerificationClasses')
                classpath = sourceSets.performanceVerification.runtimeClasspath
                mainClass = 'com.wanstu.cartographv3.LargeWorldIndexBenchmark'
                maxHeapSize = '512m'
                args rootProject.file('../../build/real-world-headers').absolutePath,
                     rootProject.file('../../build/real-world-index-results.json').absolutePath,
                     '312391'
            }
        }
    }
}
