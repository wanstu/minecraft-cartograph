<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartograph V3 图标系统预览</title>
<style>
:root{
  --bg:#0b1016;--panel:#121922;--panel2:#171f29;--line:#2a3542;
  --text:#edf2f7;--muted:#8f9dac;--gold:#f2bd45;--blue:#63b7ff;
  --green:#72cf7d;--red:#ff6767;--shadow:0 18px 50px rgba(0,0,0,.32);
  --icon-size:42px;
}
*{box-sizing:border-box}
body{margin:0;background:
  radial-gradient(circle at 76% -10%,#15304e 0,transparent 32%),
  linear-gradient(180deg,#0c1219,#090d12 72%);
  color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh}
button,input{font:inherit}
.shell{max-width:1580px;margin:0 auto;padding:18px 24px 42px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:10px 4px 18px;border-bottom:1px solid #243140}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;filter:drop-shadow(0 4px 12px rgba(242,189,69,.24))}
h1{font-size:30px;line-height:1;margin:0;letter-spacing:.3px}
h1 b{color:var(--gold)}
.sub{color:var(--muted);margin-top:7px}
.badge{border:1px solid #426b99;background:#102035;color:#9cd2ff;padding:6px 12px;border-radius:10px}
.toolbar{position:sticky;top:0;z-index:20;margin:14px 0;padding:10px;
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;
  background:rgba(11,16,22,.92);backdrop-filter:blur(14px);border:1px solid #24303d;border-radius:14px}
.tab,.size-btn{border:1px solid #2d3946;background:#141b23;color:#c8d1db;border-radius:9px;padding:8px 12px;cursor:pointer}
.tab:hover,.size-btn:hover{background:#1d2732}
.tab.active{border-color:#755d25;background:linear-gradient(#312816,#211c12);color:#ffd76e}
.search{min-width:240px;flex:1;border:1px solid #303c49;background:#0e141b;color:white;border-radius:9px;padding:9px 12px;outline:none}
.search:focus{border-color:#527da9}
.group{margin:14px 0 0;background:linear-gradient(180deg,#131a22,#10161d);border:1px solid #28333f;border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.group-head{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid #222d38}
.group-head h2{font-size:17px;margin:0}
.group-head small{color:var(--muted)}
.group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(116px,1fr));gap:10px;padding:14px}
.card{position:relative;min-height:112px;border:1px solid #2b3642;border-radius:11px;background:#151d26;
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 8px 9px;transition:.16s ease;cursor:default}
.card:hover{transform:translateY(-2px);border-color:#46586b;background:#1a242f}
.card.recommended{border-color:#8b6d26;box-shadow:inset 0 0 0 1px rgba(242,189,69,.12)}
.icon-wrap{height:58px;display:grid;place-items:center}
.icon-svg{width:var(--icon-size);height:var(--icon-size);overflow:visible;color:#e8eef5;filter:drop-shadow(0 3px 5px rgba(0,0,0,.24))}
.icon-svg .stroke{fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.icon-svg .thin{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-svg .fill{fill:currentColor;stroke:none}
.icon-svg .soft{fill:rgba(255,255,255,.13);stroke:currentColor;stroke-width:2.4}
.icon-svg .gold{fill:#f3bd44;stroke:#ffd66f;stroke-width:1.5}
.icon-svg .blue{fill:#54aef5;stroke:#92d3ff;stroke-width:1.5}
.icon-svg .green{fill:#69bd62;stroke:#9ee28f;stroke-width:1.5}
.icon-svg .brown{fill:#b88045;stroke:#e3ae71;stroke-width:1.5}
.icon-svg .purple{fill:#8e62d9;stroke:#c4a5ff;stroke-width:1.5}
.icon-svg .water{fill:#38aee7;stroke:#8ddcff;stroke-width:1.5}
.icon-svg .sand{fill:#e8bd66;stroke:#f6d794;stroke-width:1.5}
.icon-svg .stone{fill:#8b98a6;stroke:#c7d0d9;stroke-width:1.5}
.name{font-weight:650;margin-top:3px;text-align:center}
.meta{font-size:11px;color:#7e8a97;margin-top:2px;text-align:center}
.rec{position:absolute;top:7px;right:7px;color:#1a1406;background:#f2bd45;border-radius:999px;padding:1px 6px;font-size:10px;font-weight:800}
.preview{margin-top:16px;border:1px solid #4e5d40;border-radius:14px;overflow:hidden;background:#111820}
.preview-head{padding:12px 15px;border-bottom:1px solid #27323d;display:flex;align-items:center;gap:8px}
.fake-map{height:250px;position:relative;overflow:hidden;background:
  linear-gradient(135deg,transparent 0 36%,rgba(33,95,142,.9) 37% 43%,transparent 44%),
  radial-gradient(circle at 80% 30%,#b9a879 0 9%,transparent 10%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 2px,transparent 2px 5px),
  linear-gradient(135deg,#435d3a,#2e4735 58%,#544b38)}
.sample{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:5px}
.sample .icon-svg{width:42px;height:42px}
.sample span{background:rgba(8,12,16,.88);border:1px solid #7f6d3c;color:#fff;border-radius:5px;padding:3px 8px;white-space:nowrap}
.note{color:#92a0ad;font-size:12px;margin-left:auto}
.hidden{display:none!important}
footer{color:#74818f;text-align:center;padding-top:18px}
@media(max-width:720px){.shell{padding:12px}.group-grid{grid-template-columns:repeat(3,1fr)}.card{min-width:0}.hero{align-items:flex-start}.badge{display:none}}
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 3 40 24 61 32 40 40 32 61 24 40 3 32 24 24Z" fill="#f2bd45" stroke="#ffe39b" stroke-width="2"/>
        <circle cx="32" cy="32" r="8" fill="#142333" stroke="#fff1bd" stroke-width="2"/>
      </svg>
      <div><h1>Cartograph V3 <b>图标预览</b></h1><div class="sub">Minecraft 地图模组 · SVG 图标系统高保真 HTML 原型</div></div>
    </div>
    <div class="badge">V3 · ICON SYSTEM</div>
  </header>

  <div class="toolbar">
    <button class="tab active" data-filter="all">全部</button>
    <button class="tab" data-filter="player">玩家</button>
    <button class="tab" data-filter="menu">菜单</button>
    <button class="tab" data-filter="structure">结构</button>
    <button class="tab" data-filter="custom">自定义标点</button>
    <button class="tab" data-filter="geo">地理要素</button>
    <input id="search" class="search" placeholder="搜索：矿井 / 大河 / 山脉 / 港口 / 工厂…">
    <button class="size-btn" data-size="32">小</button>
    <button class="size-btn" data-size="42">中</button>
    <button class="size-btn" data-size="52">大</button>
  </div>

  <main id="app"></main>

  <section class="preview">
    <div class="preview-head"><b>地图内效果示例</b><span class="note">名称固定在图标下方，不与图标本体重叠；普通图标随地图倍率有限缩放，玩家图标固定屏幕尺寸</span></div>
    <div class="fake-map" id="mapPreview"></div>
  </section>
  <footer>单文件原型 · 所有图标均为内联 SVG · 可直接作为后续 Minecraft PNG/SVG 源图设计参考</footer>
</div>

const groups=['player','menu','structure','custom','geo'];
const groupNames={player:'玩家图标',menu:'菜单图标',structure:'结构图标',custom:'自定义标点',geo:'地理要素'};
const groupDesc={player:'玩家当前位置、朝向与定位',menu:'界面与常用操作',structure:'自动识别的主要游戏结构',custom:'玩家手动添加的常用标记',geo:'水系、山地、海岸与区域要素'};

function render(filter='all',query=''){
  const q=query.trim().toLowerCase();
  const app=document.getElementById('app'); app.innerHTML='';
  groups.forEach(g=>{
    if(filter!=='all'&&filter!==g)return;
    const list=icons.filter(x=>x.g===g && (!q||(x.name+x.meta).toLowerCase().includes(q)));
    if(!list.length)return;
    const sec=document.createElement('section'); sec.className='group'; sec.dataset.group=g;
    sec.innerHTML='<div class="group-head"><h2>'+groupNames[g]+'</h2><small>'+groupDesc[g]+'</small></div><div class="group-grid"></div>';
    const grid=sec.querySelector('.group-grid');
    list.forEach(x=>{
      const card=document.createElement('div');card.className='card'+(x.rec?' recommended':'');
      card.innerHTML=(x.rec?'<span class="rec">推荐</span>':'')+'<div class="icon-wrap">'+x.svg+'</div><div class="name">'+x.name+'</div><div class="meta">'+(x.meta||'SVG')+'</div>';
      grid.appendChild(card);
    });
    app.appendChild(sec);
  });
}
let active='all';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');active=b.dataset.filter;render(active,search.value)});
document.querySelectorAll('.size-btn').forEach(b=>b.onclick=()=>document.documentElement.style.setProperty('--icon-size',b.dataset.size+'px'));
const search=document.getElementById('search');search.oninput=()=>render(active,search.value);
render();

const samples=[
  {x:18,y:42,label:'玩家位置',svg:icons.find(x=>x.name==='导航箭头').svg},
  {x:43,y:57,label:'废弃矿井',svg:icons.find(x=>x.name==='废弃矿井').svg},
  {x:67,y:34,label:'资源点',svg:icons.find(x=>x.name==='资源点').svg},
  {x:83,y:66,label:'大河',svg:icons.find(x=>x.name==='大河').svg}
];
const mp=document.getElementById('mapPreview');
samples.forEach(s=>{const el=document.createElement('div');el.className='sample';el.style.left=s.x+'%';el.style.top=s.y+'%';el.innerHTML=s.svg+'<span>'+s.label+'</span>';mp.appendChild(el)});
</script>
